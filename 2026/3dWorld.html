	<script>
		( function () {
			const slots = [
				document.getElementById( 'page-loader-inner-slot' ),
				document.getElementById( 'ship-entry-loader-inner-slot' )
			].filter( Boolean );
			if ( !slots.length ) return;
			fetch( './TreasureSVG_animated.svg' )
				.then( ( r ) => {
					if ( !r.ok ) throw new Error( 'SVG ' + r.status );
					return r.text();
				} )
				.then( ( text ) => {
					const doc = new DOMParser().parseFromString( text, 'image/svg+xml' );
					const svg = doc.querySelector( 'svg' );
					if ( !svg ) return;
					for ( let si = 0; si < slots.length; si++ ) {
						const slot = slots[ si ];
						if ( slot.querySelector( 'svg' ) ) continue;
						const node = document.importNode( svg, true );
						node.setAttribute( 'preserveAspectRatio', 'xMidYMid meet' );
						node.setAttribute( 'width', '100%' );
						node.setAttribute( 'height', '100%' );
						slot.appendChild( node );
					}
				} )
				.catch( () => {
					const fallback = '<p style="margin:0;color:var(--gold);font-family:Georgia,\'Times New Roman\',serif;font-size:clamp(14px,3vmin,20px);text-align:center;line-height:1.5;">Loading world…</p>';
					for ( let si = 0; si < slots.length; si++ ) {
						const slot = slots[ si ];
						if ( !slot.querySelector( 'svg' ) ) slot.innerHTML = fallback;
					}
				} );
		} )();

			const MIN_MS = 2600;
			function finishLoader() {
				if ( html.classList.contains( 'page-loaded' ) ) return;
				html.classList.remove( 'page-loading' );
				html.classList.add( 'page-loaded' );
				loader.setAttribute( 'aria-busy', 'false' );

			window.__magnetSchedule3dWorldLoaderDone = function () {
				if ( window.matchMedia( '(prefers-reduced-motion: reduce)' ).matches ) {
					finishLoader();
					return;
				}
				const t0 = window.__magnetLoaderT0 ?? performance.now();
				const elapsed = performance.now() - t0;
				window.setTimeout( finishLoader, Math.max( 0, MIN_MS - elapsed ) );

						vec4 color;
						
						if ( tiltShiftEnabled && blurAmount > 0.0 ) {
							float dist = abs( vUv.y - focusY );
							float blur = smoothstep( 0.0, focusWidth, dist ) * blurAmount;
							vec4 sum = vec4( 0.0 );
							float total = 0.0;
							for ( float i = -2.0; i <= 2.0; i++ ) {
								float weight = 1.0 - abs( i ) / 2.0;
								vec2 offset = vec2( 0.0, i * blur * texelSize.y );
								sum += texture2D( tDiffuse, vUv + offset ) * weight;
								total += weight;

			function buildFlythroughChoiceMenu3D( font ) {

				/**
				 * @param {string} titleStr

				 * @param {THREE.Vector3} worldPos
				 * @param {string|null} branchKey if set, label is clickable (single-line titles only)
				 * @param {number} [targetTitleWidth] world units for title block width (default TARGET_LABEL_WIDTH)
				 * @param {{ wrapTitle?: boolean, titleGlowScale?: number, titleLineGap?: number }} [labelOpts]
				 */
				function addStyledLabelRow( titleStr, subtitleStr, worldPos, branchKey, targetTitleWidth, labelOpts ) {
					labelOpts = labelOpts || {};
					const row = new THREE.Group();
					row.position.copy( worldPos );
					const hasSub = subtitleStr != null && String( subtitleStr ).trim().length > 0;
					const titleTargetW = ( targetTitleWidth != null && targetTitleWidth > 0 ) ? targetTitleWidth : TARGET_LABEL_WIDTH;
					const wrapTitle = !!labelOpts.wrapTitle && !branchKey;
					const titleGlowScale = typeof labelOpts.titleGlowScale === 'number' ? labelOpts.titleGlowScale : 1.07;
					const titleLineGap = typeof labelOpts.titleLineGap === 'number' ? labelOpts.titleLineGap : 0.06;

					function measureTitleWidth( str ) {
						const g = new TextGeometry( str, textParams );
						g.computeBoundingBox();
						const w = g.boundingBox.max.x - g.boundingBox.min.x;
						g.dispose();
						return w;
					}
					function measureTitleHeight( str ) {
						const g = new TextGeometry( str, textParams );
						g.computeBoundingBox();
						const h = g.boundingBox.max.y - g.boundingBox.min.y;
						g.dispose();
						return h;
					}
					function wrapTitleLines( str, maxGeomW ) {
						const words = str.split( /\s+/ ).filter( Boolean );
						if ( words.length === 0 ) return [ '' ];
						const out = [];
						let cur = '';
						for ( let wi = 0; wi < words.length; wi++ ) {
							const w = words[ wi ];
							const trial = cur ? cur + ' ' + w : w;
							if ( measureTitleWidth( trial ) <= maxGeomW || !cur ) cur = trial;
							else {
								out.push( cur );
								cur = w;
							}
						}
						if ( cur ) out.push( cur );
						return out;
					}

					const fullWOneLine = measureTitleWidth( titleStr );
					let titleLines;
					if ( wrapTitle ) {
						let maxLG = Math.max( textParams.size * 2.5, fullWOneLine * 0.38 );
						titleLines = wrapTitleLines( titleStr, maxLG );
						let guard = 0;
						while ( titleLines.length < 2 && maxLG > textParams.size * 2 && guard++ < 20 ) {
							maxLG *= 0.86;
							titleLines = wrapTitleLines( titleStr, maxLG );
						}
					} else {
						titleLines = [ titleStr ];
					}

					let maxLnW = 0;
					for ( let ti = 0; ti < titleLines.length; ti++ ) {
						maxLnW = Math.max( maxLnW, measureTitleWidth( titleLines[ ti ] ) );
					}
					const fitScale = maxLnW > 1e-6 ? titleTargetW / maxLnW : 1;
					const lineDispHs = titleLines.map( ( ln ) => measureTitleHeight( ln ) * fitScale );
					let totalTitleH = 0;
					for ( let li = 0; li < lineDispHs.length; li++ ) {
						totalTitleH += lineDispHs[ li ];
						if ( li < lineDispHs.length - 1 ) totalTitleH += titleLineGap;
					}
					const maxTitleDispW = Math.max( ...titleLines.map( ( ln ) => measureTitleWidth( ln ) * fitScale ), 0.001 );
					const dispW = maxTitleDispW;

					const padX = 0.35, padY = 0.14;
					const gapYTitleSub = 0.08;
					let alignY = 0;
					let subY = 0;
					let subDispW = 0;
					let subDispH = 0;
					let subFit = 1;
					/** @type {THREE.BufferGeometry|null} */
					let subGeo = null;
					if ( hasSub ) {
						const subParams = {

							curveSegments: 10,
							bevelEnabled: false
						};
						const maxSubW = dispW * 0.36;
						subGeo = new TextGeometry( String( subtitleStr ), subParams );
						subGeo.computeBoundingBox();
						const sbb = subGeo.boundingBox;
						const stw = sbb.max.x - sbb.min.x;
						const sth = sbb.max.y - sbb.min.y;
						subGeo.center();
						subFit = stw > 1e-6 ? maxSubW / stw : 1;
						subDispW = stw * subFit;
						subDispH = sth * subFit;

						opacity: 0.75,
						side: THREE.DoubleSide,
						toneMapped: false,
						depthTest: true,
						depthWrite: false
					} );
					const blockW = hasSub ? Math.max( dispW, subDispW ) + padX * 2 : dispW + padX * 2;
					const blockH = ( hasSub ? totalTitleH + gapYTitleSub + subDispH : totalTitleH ) + padY * 2;
					const backGeo = new THREE.PlaneGeometry( blockW, blockH );
					const backMesh = new THREE.Mesh( backGeo, backMat );
					backMesh.position.set( 0, 0, -0.14 );
					backMesh.renderOrder = 0;
					row.add( backMesh );

						color: 0xffb24a,
						transparent: true,
						opacity: 0.42,
						side: THREE.DoubleSide,
						toneMapped: false,
						depthTest: true,
						depthWrite: false,
						blending: THREE.AdditiveBlending
					} );
					const textMat = new THREE.MeshBasicMaterial( {
						color: 0xfffef5,
						transparent: true,
						opacity: 1,
						side: THREE.DoubleSide,
						toneMapped: false,
						depthTest: true,
						depthWrite: true
					} );

					const titleLineTextMeshes = [];
					const titleLineGlowMeshes = [];
					for ( let li = 0; li < titleLines.length; li++ ) {
						const lineStr = titleLines[ li ];
						const textGeo = new TextGeometry( lineStr, textParams );

						textGeo.center();
						const ly = yCursor - lineDispHs[ li ] * 0.5;
						yCursor -= lineDispHs[ li ] + titleLineGap;

						const glowMesh = new THREE.Mesh( textGeo, glowMat );
						glowMesh.scale.setScalar( fitScale * titleGlowScale );
						glowMesh.position.set( 0, ly, -0.04 );
						glowMesh.castShadow = false;
						glowMesh.receiveShadow = false;
						glowMesh.renderOrder = 1;
						row.add( glowMesh );
						titleLineGlowMeshes.push( glowMesh );

						const textMesh = new THREE.Mesh( textGeo, textMat );
						textMesh.scale.setScalar( fitScale );
						textMesh.position.set( 0, ly, 0 );
						textMesh.castShadow = false;
						textMesh.receiveShadow = false;
						if ( branchKey ) textMesh.userData.branchKey = branchKey;
						textMesh.renderOrder = 2;
						row.add( textMesh );
						titleLineTextMeshes.push( textMesh );
					}

					const textMesh = titleLineTextMeshes[ 0 ];
					const glowMesh = titleLineGlowMeshes[ 0 ];

					/** @type {THREE.Mesh|null} */
					let subGlowMesh = null;
					/** @type {THREE.Mesh|null} */
					let subTextMesh = null;
					if ( hasSub && subGeo ) {
						const subGlowMat = new THREE.MeshBasicMaterial( {
							color: 0xe6a030,

						subGlowMesh = new THREE.Mesh( subGeo, subGlowMat );
						subGlowMesh.scale.setScalar( subFit * 1.06 );
						subGlowMesh.position.set( 0, subY, -0.03 );
						subGlowMesh.renderOrder = 1;
						row.add( subGlowMesh );

						const subMat = new THREE.MeshBasicMaterial( {
							color: 0xf0e6d2,
							transparent: true,
							opacity: 0.92,
							side: THREE.DoubleSide,
							toneMapped: false,
							depthTest: true,
							depthWrite: true
						} );
						subTextMesh = new THREE.Mesh( subGeo, subMat );
						subTextMesh.scale.setScalar( subFit );
						subTextMesh.position.set( 0, subY, 0 );
						subTextMesh.renderOrder = 2;
						row.add( subTextMesh );
					}

					/** @type {THREE.Mesh|null} */
					let hitMesh = null;
					if ( branchKey ) {
						const hitGeo = new THREE.PlaneGeometry( blockW * 1.04, blockH * 1.04 );

							transparent: true,

			function ensureFlythroughChoiceMenuBuilt() {

			function updateFlythroughChoiceButtonStates() {
				for ( let i = 0; i < flythroughChoiceEntries.length; i++ ) {
					const e = flythroughChoiceEntries[ i ];
					const ok = !!branchFlythroughStates[ e.branchKey ];
					e.hitMesh.visible = ok;
					e.backMesh.visible = ok;
					const tMeshes = e.titleLineTextMeshes && e.titleLineTextMeshes.length ? e.titleLineTextMeshes : ( e.textMesh ? [ e.textMesh ] : [] );
					const gMeshes = e.titleLineGlowMeshes && e.titleLineGlowMeshes.length ? e.titleLineGlowMeshes : ( e.glowMesh ? [ e.glowMesh ] : [] );
					for ( let ti = 0; ti < tMeshes.length; ti++ ) {
						const tm = tMeshes[ ti ];
						if ( !tm ) continue;
						tm.visible = ok;
						tm.material.opacity = ok ? 1 : 0.35;
					}
					for ( let gi = 0; gi < gMeshes.length; gi++ ) {
						const gm = gMeshes[ gi ];
						if ( !gm ) continue;
						gm.visible = ok;
						gm.material.opacity = ok ? 0.42 : 0.1;

			function canPickFlythroughChoices() {
				if ( isInteriorMap() ) return false;
				if ( !flythroughActive || !mainFlythroughState ) return false;
				if ( flythroughSegment === 'bridge' || flythroughSegment === 'reverseBridge' ) return false;
				if ( flythroughSegment === 'choice' ) return true;
				if ( flythroughSegment === 'main' && flythroughState === mainFlythroughState ) {
					const D = mainFlythroughState.duration;
					return Math.max( flythroughTime, flythroughTargetTime ) >= D * MAIN_PATH_FORK_PICK_TIME_FRAC;
				}

			window.addEventListener( 'mousemove', ( e ) => {

			/**
			 * @returns {THREE.Intersection|null}
			 */
			function pickFlythroughChoiceHitAt( clientX, clientY ) {
				if ( flythroughChoicePickables.length === 0 ) return null;
				const canvas = renderer.domElement;
				const r = canvas.getBoundingClientRect();
				const R = isMobileDevice ? FLYTHROUGH_CHOICE_MOBILE_TOUCH_PICK_RADIUS_PX : 0;
				const c = R * 0.7071067811865476;
				const sampleOxOy = R <= 0
					? [ [ 0, 0 ] ]
					: [
						[ 0, 0 ],
						[ R, 0 ], [ -R, 0 ], [ 0, R ], [ 0, -R ],
						[ c, c ], [ c, -c ], [ -c, c ], [ -c, -c ]
					];
				for ( let si = 0; si < sampleOxOy.length; si++ ) {
					const ox = sampleOxOy[ si ][ 0 ], oy = sampleOxOy[ si ][ 1 ];
					_choiceNdc.x = ( ( clientX + ox - r.left ) / r.width ) * 2 - 1;

			function cubicBez( t, p0, p1, p2, p3 ) {
				const mt = 1 - t;
				return mt * mt * mt * p0 + 3 * mt * mt * t * p1 + 3 * mt * t * t * p2 + t * t * t * p3;
			}

			function solveBezT( x, cx1, cx2 ) {
				let lo = 0, hi = 1;
				for ( let i = 0; i < 32; i++ ) {
					const mid = ( lo + hi ) / 2;
					if ( cubicBez( mid, 0, cx1, cx2, 1 ) < x ) lo = mid; else hi = mid;

				return ( lo + hi ) / 2;

				if ( !keyframes || keyframes.length === 0 ) return 0;
				if ( t <= keyframes[ 0 ].position ) return keyframes[ 0 ].value;
				if ( t >= keyframes[ keyframes.length - 1 ].position ) return keyframes[ keyframes.length - 1 ].value;
				let i = 0;
				for ( ; i < keyframes.length - 1; i++ ) {
					if ( t <= keyframes[ i + 1 ].position ) break;
				}
				const kfA = keyframes[ i ], kfB = keyframes[ i + 1 ];
				const dt = kfB.position - kfA.position;
				if ( dt < 0.0001 ) return kfA.value;
				const tNorm = ( t - kfA.position ) / dt;
				const u = solveBezT( tNorm, kfA.handles[ 2 ], kfB.handles[ 0 ] );
				const vNorm = cubicBez( u, 0, kfA.handles[ 3 ], kfB.handles[ 1 ], 1 );

			function buildBookstoreLiteraturePanels( bookstoreGroup ) {

				/**

				function buildShipLitCaptionRowGroup( font, titleStr, artistStr, titleTargetW ) {
					if ( !font ) return null;
					const row = new THREE.Group();
					row.name = 'ShipLitCaption';
					const titleRaw = String( titleStr || '' ).trim() || '—';

					function wrapTitleLines( str, maxGeomW ) {
						const words = str.split( /\s+/ ).filter( Boolean );
						if ( words.length === 0 ) return [ '' ];
						const out = [];
						let cur = '';
						for ( let wi = 0; wi < words.length; wi++ ) {

							const trial = cur ? cur + ' ' + w : w;
							if ( measureTitleWidth( trial ) <= maxGeomW || !cur ) cur = trial;

				function rebuildShipLitPanelFrame( parts, artW, artH, ft ) {

				const sconceY = 8;
				[ -18, -6, 6, 18 ].forEach( ( zz ) => {
					createWallSconce( -17.5, sconceY, zz, 0 );
					createWallSconce( 17.5, sconceY, zz, Math.PI );

				function addSpotlight( zPos ) {
					const spotLight = new THREE.SpotLight( 0xffd599, 3, 40, Math.PI / 6, 0.8, 1.5 );
					spotLight.position.set( 0, roomHeight - 1, zPos );

			function createShipWoodCanvasTexture() {
				const canvas = document.createElement( 'canvas' );
				canvas.width = 512;
				canvas.height = 512;
				const ctx = canvas.getContext( '2d' );
				ctx.fillStyle = '#3a2318';
				ctx.fillRect( 0, 0, 512, 512 );
				const grainIters = isMobileDevice ? 900 : 2800;
				for ( let i = 0; i < grainIters; i++ ) {
					ctx.fillStyle = Math.random() > 0.5 ? 'rgba(0,0,0,0.28)' : 'rgba(90,50,30,0.14)';
					ctx.fillRect( Math.random() * 512, Math.random() * 512, Math.random() * 3 + 1, Math.random() * 50 + 8 );
				}
				ctx.fillStyle = '#0a0502';
				const planks = 12;
				const plankW = 512 / planks;
				for ( let i = 1; i < planks; i++ ) ctx.fillRect( i * plankW - 2, 0, 4, 512 );
				const tex = new THREE.CanvasTexture( canvas );
				tex.colorSpace = THREE.SRGBColorSpace;
				tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
				tex.anisotropy = isMobileDevice ? 1 : 8;
				return tex;
			}

			function buildShipLiteraturePanels( deckGroup ) {
				const litRoot = new THREE.Group();
				litRoot.name = 'ShipLiteraturePanels';
				deckGroup.add( litRoot );
				const literaturePickMeshes = [];
				const literaturePanelMeta = [];
				const pieces = globalThis.ART_PIECES;
				if ( !Array.isArray( pieces ) || pieces.length === 0 ) {
					return {
						literaturePickMeshes,
						literaturePanelMeta,
						literatureRoot: litRoot,
						disposeLiteraturePanels: () => {
							if ( litRoot.parent ) litRoot.parent.remove( litRoot );
							litRoot.clear();
						}
					};
				}
				const loader = new THREE.TextureLoader();
				const maxAniso = isMobileDevice ? 1 : Math.min( 8, renderer.capabilities.getMaxAnisotropy() );
				const n = pieces.length;
				const frameT = 0.18;
				const Sship = deckGroup.scale.x;
				const centerX = SHIP_SPAWN.x / Sship;
				const centerZ = SHIP_SPAWN.z / Sship;
				const eyeWorldY = SHIP_SPAWN.y + ( PLAYER_HEIGHT / 2 + PLAYER_EYE_HEIGHT - PLAYER_HEIGHT );
				const ringY = eyeWorldY / Sship;
				const ringRadius = 20;

				function shipArtPlaneSizeFromAspect( aspect ) {
					const maxW = 6.35;
					const maxH = 7.55;
					if ( !isFinite( aspect ) || aspect <= 0 ) return { artW: 5.2, artH: 6.5 };
					let h = maxH;
					let w = h * aspect;
					if ( w > maxW ) {
						w = maxW;
						h = w / aspect;
					}
					return { artW: w, artH: h };
				}

				const SHIP_CAPTION_GAP_BELOW_FRAME = 0.28;
				const SHIP_CAPTION_Z = 0.12;

				function disposeShipLitCaptionRow( row ) {
					if ( !row ) return;
					row.traverse( ( o ) => {
						if ( o.geometry ) o.geometry.dispose();
						if ( o.material ) {
							const m = o.material;
							if ( m.map ) {
								m.map.dispose();
								m.map = null;
							}
							m.dispose();
						}
					} );
				}

				/**
				 * Title + artist under a ship art frame — same material language as flythrough choice labels.
				 * @returns {THREE.Group|null}
				 */
				function buildShipLitCaptionRowGroup( font, titleStr, artistStr, titleTargetW ) {
					if ( !font ) return null;
					const row = new THREE.Group();
					row.name = 'ShipLitCaption';
					const titleRaw = String( titleStr || '' ).trim() || '—';
					const artistRaw = String( artistStr || '' ).trim();
					const hasSub = artistRaw.length > 0;
					const titleLineGap = 0.058;
					const titleGlowScale = 1.07;
					const textParams = {
						font: font,
						size: 0.38,
						height: 0.056,
						curveSegments: 10,
						bevelEnabled: false
					};
					function measureTitleWidth( str ) {
						const g = new TextGeometry( str, textParams );
						g.computeBoundingBox();
						const w = g.boundingBox.max.x - g.boundingBox.min.x;
						g.dispose();
						return w;
					}
					function measureTitleHeight( str ) {
						const g = new TextGeometry( str, textParams );
						g.computeBoundingBox();
						const h = g.boundingBox.max.y - g.boundingBox.min.y;
						g.dispose();
						return h;
					}
					function wrapTitleLines( str, maxGeomW ) {
						const words = str.split( /\s+/ ).filter( Boolean );
						if ( words.length === 0 ) return [ '' ];
						const out = [];
						let cur = '';
						for ( let wi = 0; wi < words.length; wi++ ) {
							const w = words[ wi ];
							const trial = cur ? cur + ' ' + w : w;
							if ( measureTitleWidth( trial ) <= maxGeomW || !cur ) cur = trial;
							else {
								out.push( cur );
								cur = w;
							}
						}
						if ( cur ) out.push( cur );
						return out;
					}
					const fullWOneLine = measureTitleWidth( titleRaw );
					let maxLG = Math.max( textParams.size * 2.2, fullWOneLine * 0.36 );
					let titleLines = wrapTitleLines( titleRaw, maxLG );
					let guard = 0;
					while ( titleLines.length > 4 && maxLG > textParams.size * 1.15 && guard++ < 28 ) {
						maxLG *= 0.9;
						titleLines = wrapTitleLines( titleRaw, maxLG );
					}
					if ( titleLines.length > 4 ) titleLines = titleLines.slice( 0, 4 );
					let maxLnW = 0;
					for ( let ti = 0; ti < titleLines.length; ti++ ) {
						maxLnW = Math.max( maxLnW, measureTitleWidth( titleLines[ ti ] ) );
					}
					const tw = titleTargetW > 0 ? titleTargetW : 3.2;
					const fitScale = maxLnW > 1e-6 ? Math.min( 1.22, tw / maxLnW ) : 1;
					const lineDispHs = titleLines.map( ( ln ) => measureTitleHeight( ln ) * fitScale );
					let totalTitleH = 0;
					for ( let li = 0; li < lineDispHs.length; li++ ) {
						totalTitleH += lineDispHs[ li ];
						if ( li < lineDispHs.length - 1 ) totalTitleH += titleLineGap;
					}
					const maxTitleDispW = Math.max( ...titleLines.map( ( ln ) => measureTitleWidth( ln ) * fitScale ), 0.001 );
					const dispW = maxTitleDispW;

					const padX = 0.38;
					const padY = 0.16;
					const gapYTitleSub = 0.082;
					let alignY = 0;
					let subY = 0;
					let subDispW = 0;
					let subDispH = 0;
					let subFit = 1;
					let subGeo = null;
					if ( hasSub ) {
						const subParams = {
							font: font,
							size: textParams.size * 0.34,
							height: textParams.height * 0.38,
							curveSegments: 10,
							bevelEnabled: false
						};
						const maxSubW = dispW * 1.02;
						subGeo = new TextGeometry( artistRaw, subParams );
						subGeo.computeBoundingBox();
						const sbb = subGeo.boundingBox;
						const stw = sbb.max.x - sbb.min.x;
						const sth = sbb.max.y - sbb.min.y;
						subGeo.center();
						subFit = stw > 1e-6 ? Math.min( 1.14, maxSubW / stw ) : 1;
						subDispW = stw * subFit;
						subDispH = sth * subFit;
						alignY = gapYTitleSub * 0.5 + subDispH * 0.5 + totalTitleH * 0.5;
						subY = alignY - totalTitleH * 0.5 - gapYTitleSub - subDispH * 0.5;
					}

					const titleCentY = hasSub ? alignY : 0;
					let yCursor = titleCentY + totalTitleH * 0.5;

					const backMat = new THREE.MeshBasicMaterial( {
						color: 0x120a06,
						transparent: true,
						opacity: 0.9,
						side: THREE.DoubleSide,
						toneMapped: false,
						depthTest: true,
						depthWrite: false,
						polygonOffset: true,
						polygonOffsetFactor: -2,
						polygonOffsetUnits: -2
					} );
					const blockW = hasSub ? Math.max( dispW, subDispW ) + padX * 2 : dispW + padX * 2;
					const blockH = ( hasSub ? totalTitleH + gapYTitleSub + subDispH : totalTitleH ) + padY * 2;
					row.userData.shipCaptionBlockH = blockH;
					const backGeo = new THREE.PlaneGeometry( blockW, blockH );
					const backMesh = new THREE.Mesh( backGeo, backMat );
					backMesh.position.set( 0, 0, -0.08 );
					backMesh.renderOrder = 4;
					row.add( backMesh );

					const glowMat = new THREE.MeshBasicMaterial( {
						color: 0xffb24a,
						transparent: true,
						opacity: 0.46,
						side: THREE.DoubleSide,
						toneMapped: false,
						depthTest: true,
						depthWrite: false,
						blending: THREE.AdditiveBlending,
						polygonOffset: true,
						polygonOffsetFactor: -4,
						polygonOffsetUnits: -4
					} );
					const textMat = new THREE.MeshBasicMaterial( {
						color: 0xfffff8,
						transparent: true,
						opacity: 1,
						side: THREE.DoubleSide,
						toneMapped: false,
						depthTest: true,
						depthWrite: true,
						polygonOffset: true,
						polygonOffsetFactor: -4,
						polygonOffsetUnits: -4
					} );

					for ( let li = 0; li < titleLines.length; li++ ) {
						const lineStr = titleLines[ li ];
						const textGeo = new TextGeometry( lineStr, textParams );
						textGeo.computeBoundingBox();
						textGeo.center();
						const ly = yCursor - lineDispHs[ li ] * 0.5;
						yCursor -= lineDispHs[ li ] + titleLineGap;

						const glowGeo = textGeo.clone();
						const glowMesh = new THREE.Mesh( glowGeo, glowMat );
						glowMesh.scale.setScalar( fitScale * titleGlowScale );
						glowMesh.position.set( 0, ly, -0.02 );
						glowMesh.renderOrder = 5;
						row.add( glowMesh );

						const fillMesh = new THREE.Mesh( textGeo, textMat );
						fillMesh.scale.setScalar( fitScale );
						fillMesh.position.set( 0, ly, 0.012 );
						fillMesh.renderOrder = 6;
						row.add( fillMesh );
					}

					if ( hasSub && subGeo ) {
						const subGlowMat = new THREE.MeshBasicMaterial( {
							color: 0xe6a030,
							transparent: true,
							opacity: 0.34,
							side: THREE.DoubleSide,
							toneMapped: false,
							depthTest: true,
							depthWrite: false,
							blending: THREE.AdditiveBlending,
							polygonOffset: true,
							polygonOffsetFactor: -4,
							polygonOffsetUnits: -4
						} );
						const subGlowMesh = new THREE.Mesh( subGeo.clone(), subGlowMat );
						subGlowMesh.scale.setScalar( subFit * 1.06 );
						subGlowMesh.position.set( 0, subY, -0.016 );
						subGlowMesh.renderOrder = 5;
						row.add( subGlowMesh );

						const subMat = new THREE.MeshBasicMaterial( {
							color: 0xf8f0e4,
							transparent: true,
							opacity: 0.97,
							side: THREE.DoubleSide,
							toneMapped: false,
							depthTest: true,
							depthWrite: true,
							polygonOffset: true,
							polygonOffsetFactor: -4,
							polygonOffsetUnits: -4
						} );
						const subTextMesh = new THREE.Mesh( subGeo, subMat );
						subTextMesh.scale.setScalar( subFit );
						subTextMesh.position.set( 0, subY, 0.012 );
						subTextMesh.renderOrder = 6;
						row.add( subTextMesh );
					}

					return row;
				}

				function rebuildShipLitPanelFrame( parts, artW, artH, ft ) {
					const pg = parts.panelGroup;
					const fw = artW + ft * 2;
					const fh = artH + ft * 2;
					function replPlane( mesh, w, h ) {
						mesh.geometry.dispose();
						mesh.geometry = new THREE.PlaneGeometry( w, h );
					}
					replPlane( parts.back, artW + 0.3, artH + 0.3 );
					replPlane( parts.art, artW, artH );
					replPlane( parts.pick, artW + 0.28, artH + 0.28 );
					parts.rimLine.geometry.dispose();
					parts.rimLine.geometry = new THREE.EdgesGeometry( new THREE.PlaneGeometry( fw + 0.06, fh + 0.06 ) );
					parts.outerRimLine.geometry.dispose();
					parts.outerRimLine.geometry = new THREE.EdgesGeometry( new THREE.PlaneGeometry( fw + 0.42, fh + 0.42 ) );
					parts.hoverEdgeLine.geometry.dispose();
					parts.hoverEdgeLine.geometry = new THREE.EdgesGeometry( new THREE.PlaneGeometry( artW + 0.38, artH + 0.38 ) );
					for ( let fi = 0; fi < parts.frameBars.length; fi++ ) {
						const mesh = parts.frameBars[ fi ];
						pg.remove( mesh );
						mesh.geometry.dispose();
					}
					parts.frameBars.length = 0;
					function addFrameBar( sx, sy, sz, px, py, pz ) {
						const geo = new THREE.BoxGeometry( sx, sy, sz );
						const mesh = new THREE.Mesh( geo, parts.frameMat );
						mesh.position.set( px, py, pz );
						pg.add( mesh );
						parts.frameBars.push( mesh );
					}
					addFrameBar( fw, ft, ft * 1.2, 0, fh / 2 + ft / 2, 0.035 );
					addFrameBar( fw, ft, ft * 1.2, 0, -fh / 2 - ft / 2, 0.035 );
					addFrameBar( ft, fh, ft * 1.2, fw / 2 + ft / 2, 0, 0.035 );
					addFrameBar( ft, fh, ft * 1.2, -fw / 2 - ft / 2, 0, 0.035 );
					if ( parts.captionRow ) {
						disposeShipLitCaptionRow( parts.captionRow );
						parts.panelGroup.remove( parts.captionRow );
						parts.captionRow = null;
						const capW = Math.min( 6.35, fw * 0.98 );
						const ct = parts.captionTitle != null ? parts.captionTitle : '';
						const ca = parts.captionArtist != null ? parts.captionArtist : '';
						const fontR = flythroughChoiceFontRef;
						let row = null;
						if ( isMobileDevice || shipLitCaptionNeedsCanvasTexture( ct, ca ) ) {
							row = buildShipLitCaptionRowCanvasGroup( ct, ca, capW );
						} else if ( fontR ) {
							row = buildShipLitCaptionRowGroup( fontR, ct, ca, capW );
						}
						if ( row ) {
							const bh = row.userData.shipCaptionBlockH || 0.48;
							row.position.set( 0, -fh * 0.5 - ft - SHIP_CAPTION_GAP_BELOW_FRAME - bh * 0.5, SHIP_CAPTION_Z );
							parts.panelGroup.add( row );
							parts.captionRow = row;

				for ( let i = 0; i < n; i++ ) {
					const ang = ( i / n ) * Math.PI * 2;
					const x = centerX + Math.cos( ang ) * ringRadius;
					const z = centerZ + Math.sin( ang ) * ringRadius;
					const pg = new THREE.Group();
					pg.position.set( x, ringY, z );
					pg.lookAt( centerX, ringY, centerZ );
					litRoot.add( pg );

					const piece = pieces[ i ];
					if ( piece && piece.interaction === 'exitToCave' ) {
						const artW = 5.45;
						const artH = 2.5;
						const line1 = piece.title != null ? String( piece.title ) : 'RETURN';
						const line2Join = [ piece.subtitle, piece.medium ].filter( ( x ) => x != null && String( x ).trim() !== '' ).map( ( x ) => String( x ) ).join( ' ' );
						const line2 = line2Join || 'TO THE CAVE';

						const backGeo = new THREE.PlaneGeometry( artW + 0.3, artH + 0.3 );
						const backMat = new THREE.MeshStandardMaterial( { color: 0x100d0b, roughness: 0.98 } );
						const back = new THREE.Mesh( backGeo, backMat );
						back.position.z = -0.055;
						pg.add( back );

						const artGeo = new THREE.PlaneGeometry( artW, artH );
						const artMat = new THREE.MeshBasicMaterial( { color: 0xffffff, transparent: true, opacity: 0, toneMapped: false, depthWrite: false } );
						const art = new THREE.Mesh( artGeo, artMat );
						art.position.z = 0.02;
						pg.add( art );

						const fontRef = flythroughChoiceFontRef;
						if ( fontRef && !isMobileDevice ) {
							const glowMat = new THREE.MeshBasicMaterial( {
								color: 0xffb24a, transparent: true, opacity: 0.42, side: THREE.DoubleSide,
								toneMapped: false, depthTest: true, depthWrite: false, blending: THREE.AdditiveBlending
							} );
							const textMat = new THREE.MeshBasicMaterial( {
								color: 0xfffef5, transparent: true, opacity: 1, side: THREE.DoubleSide,
								toneMapped: false, depthTest: true, depthWrite: true
							} );
							const titleParams = { font: fontRef, size: 0.48, height: 0.075, curveSegments: 10, bevelEnabled: false };
							const subParams = { font: fontRef, size: 0.19, height: 0.034, curveSegments: 10, bevelEnabled: false };
							const g1 = new TextGeometry( line1, titleParams );
							g1.computeBoundingBox();
							g1.center();
							const g2 = new TextGeometry( line2, subParams );
							g2.computeBoundingBox();
							g2.center();
							const bb1 = g1.boundingBox;
							const bb2 = g2.boundingBox;
							const h1 = bb1.max.y - bb1.min.y;
							const h2 = bb2.max.y - bb2.min.y;
							const gap = 0.12;
							const totalH = h1 + gap + h2;
							const yTitle = totalH * 0.5 - h1 * 0.5;
							const ySub = -totalH * 0.5 + h2 * 0.5;
							const zText = 0.045;
							const g1g = g1.clone();

							glow2.renderOrder = 2;

							fill2.renderOrder = 3;
							pg.add( fill2 );
						} else {
							const c = document.createElement( 'canvas' );
							c.width = 1024;
							c.height = 512;
							const ctx = c.getContext( '2d' );
							const cw = c.width;
							const ch = c.height;
							ctx.fillStyle = '#1a1008';
							ctx.fillRect( 0, 0, cw, ch );
							ctx.strokeStyle = '#d4a574';
							ctx.lineWidth = 10;
							ctx.strokeRect( 24, 24, cw - 48, ch - 48 );
							ctx.fillStyle = '#fffef5';
							ctx.textAlign = 'center';
							ctx.textBaseline = 'middle';
							ctx.font = 'bold 86px Arial, Helvetica, sans-serif';
							ctx.fillText( line1, cw / 2, ch * 0.38 );
							ctx.font = '500 52px Arial, Helvetica, sans-serif';
							ctx.fillStyle = '#ffe8c8';
							ctx.fillText( line2, cw / 2, ch * 0.62 );
							const signTex = new THREE.CanvasTexture( c );
							signTex.colorSpace = THREE.SRGBColorSpace;
							signTex.needsUpdate = true;
							artMat.opacity = 1;
							artMat.depthWrite = true;
							artMat.map = signTex;
							artMat.needsUpdate = true;
						}

						const frameMat = new THREE.MeshStandardMaterial( {
							color: 0xd4af37, metalness: 0.52, roughness: 0.4,
							emissive: new THREE.Color( 0x553311 ), emissiveIntensity: 0.11, toneMapped: true
						} );
						const frameBars = [];
						function addFrameBar( sx, sy, sz, px, py, pz ) {
							const geo = new THREE.BoxGeometry( sx, sy, sz );
							const mesh = new THREE.Mesh( geo, frameMat );
							mesh.position.set( px, py, pz );
							pg.add( mesh );
							frameBars.push( mesh );
						}
						const fw = artW + frameT * 2;
						const fh = artH + frameT * 2;
						addFrameBar( fw, frameT, frameT * 1.2, 0, fh / 2 + frameT / 2, 0.035 );
						addFrameBar( fw, frameT, frameT * 1.2, 0, -fh / 2 - frameT / 2, 0.035 );
						addFrameBar( frameT, fh, frameT * 1.2, fw / 2 + frameT / 2, 0, 0.035 );
						addFrameBar( frameT, fh, frameT * 1.2, -fw / 2 - frameT / 2, 0, 0.035 );

						const rimEdges = new THREE.EdgesGeometry( new THREE.PlaneGeometry( fw + 0.06, fh + 0.06 ) );
						const rimMat = new THREE.LineBasicMaterial( {
							color: 0x7a9ec8, transparent: true, opacity: 0.56, toneMapped: false,

			function updateShipLiteraturePanelsHover( elapsed ) {
				const meta = shipMapCache?.literaturePanelMeta;
				if ( !meta?.length ) return;
				const idleRim = 0x7a9ec8;
				const idleOuter = 0x5a7aa8;
				const idleEdge = 0xa8c8e8;
				const hiRim = 0x99f5ff;
				const hiOuter = 0x22a8ff;
				const hiEdge = 0xe8fbff;
				if ( activeMap !== 'ship' || shipLitModalOpen || flythroughActive ) {
					shipLitHoverIndex = -1;
					shipLitHoverIndexCached = -1;
					for ( let i = 0; i < meta.length; i++ ) {
						const m = meta[ i ];
						m.rimMat.opacity = 0.56;
						m.rimMat.color.setHex( idleRim );
						if ( m.outerRimMat ) {
							m.outerRimMat.opacity = 0.44;
							m.outerRimMat.color.setHex( idleOuter );
						}
						m.frameMat.emissiveIntensity = 0.11;
						if ( m.hoverEdgeMat ) {
							m.hoverEdgeMat.color.setHex( idleEdge );
							m.hoverEdgeMat.opacity = 0.34;
						}
						m.panelGroup.scale.setScalar( 1 );
					}
					return;
				}
				shipLitRaycastFrame++;
				const _shipLitRayEvery = isMobileDevice ? 3 : 2;
				if ( ( shipLitRaycastFrame % _shipLitRayEvery ) === 0 ) {
					shipLitHoverIndexCached = raycastShipLitCenterHitIndex();
				}
				shipLitHoverIndex = shipLitHoverIndexCached;
				for ( let i = 0; i < meta.length; i++ ) {
					const m = meta[ i ];
					const on = i === shipLitHoverIndex;
					const t = elapsed;
					const pulse = 0.5 * ( Math.sin( t * 7.4 ) + 0.42 * Math.sin( t * 11.8 + 0.9 ) );
					const pulse2 = 0.5 * Math.sin( t * 5.1 + 0.35 );
					const beat = 0.5 + 0.5 * Math.sin( t * 6.6 );
					if ( on ) {
						m.rimMat.color.setHex( hiRim );
						m.rimMat.opacity = 0.98 + 0.02 * pulse2;
						if ( m.outerRimMat ) {
							m.outerRimMat.color.setHex( hiOuter );
							m.outerRimMat.opacity = 0.82 + 0.16 * pulse + 0.06 * beat;
						}
						m.frameMat.emissiveIntensity = 0.38 + 0.22 * pulse2 + 0.12 * Math.sin( t * 4.2 );
						m.frameMat.emissive.setHex( 0x112244 );
						if ( m.hoverEdgeMat ) {
							m.hoverEdgeMat.color.setHex( hiEdge );

				}
				if ( collisionWireframe ) collisionWireframe.visible = false;
				scene.add( t.group );
				for ( let i = 0; i < t.bodies.length; i++ ) {
					world.addBody( t.bodies[ i ] );
				}
				if ( water ) water.visible = false;

				playerBody.position.set( THEATER_SPAWN.x, THEATER_SPAWN.y, THEATER_SPAWN.z );
				playerBody.velocity.set( 0, 0, 0 );
				const eyeH = getPlayerEyeHeight();
				smoothedCameraPos.set( THEATER_SPAWN.x, THEATER_SPAWN.y + eyeH, THEATER_SPAWN.z );
				camera.rotation.order = 'YXZ';
				camera.rotation.x = 0;
				camera.rotation.y = 0;

				scene.background = new THREE.Color( 0x1a1520 );
				scene.fog = new THREE.Fog( 0x1a1520, 6, 38 );
				fillLight1.intensity = Math.max( 0.35, fillLight1.intensity * 0.25 );
				directionalLight.intensity = Math.min( 1.2, directionalLight.intensity * 0.4 );

				theaterSavedBloomEnabled = bloomPass.enabled;
				bloomPass.enabled = false;

				theaterGodRaysPass.uniforms.strength.value = 1.35;
				if ( isMobile ) theaterGodRaysPass.uniforms.exposure.value = 0.36;

				if ( t.videoEl ) {
					t.videoEl.play().catch( () => {} );
				}
				syncWorldAmbientMusic();
				updateTreasureMapNavUi();
			}

			function exitTheaterToMain() {
				if ( activeMap !== 'theater' || !mainMapRoot ) return;
				exitTheaterVideoFullscreenIfActive();
				activeMap = 'main';
				const t = getTheaterMap();
				scene.remove( t.group );
				for ( let i = 0; i < t.bodies.length; i++ ) {
					world.removeBody( t.bodies[ i ] );
				}
				scene.add( mainMapRoot );
				setMainMapTorchEffectsVisible( true );
				for ( let i = 0; i < mainWorldStaticBodies.length; i++ ) {
					world.addBody( mainWorldStaticBodies[ i ] );
				}
				if ( collisionWireframe ) collisionWireframe.visible = envSettings.showCollisionWireframe;
				if ( water ) water.visible = true;

				if ( theaterSavedBloomEnabled !== null ) {
					bloomPass.enabled = theaterSavedBloomEnabled;
					theaterSavedBloomEnabled = null;
				}
				theaterGodRaysPass.uniforms.strength.value = 0;
				theaterGodRaysPass.uniforms.exposure.value = 0.52;
				applySettings();
				activateMainFlythroughAtPathEnd();

				if ( t.videoEl ) {
					t.videoEl.muted = true;
					t.videoEl.pause();
				}
				restoreTheaterVideoDomPeek();
				if ( theaterHoverOverlay ) theaterHoverOverlay.style.display = 'none';
				syncWorldAmbientMusic();
				updateTreasureMapNavUi();
			}

			function teleportMiniNavExitFlythroughIfNeeded() {
				if ( flythroughActive ) exitFlythrough();
			}

			/**
			 * Menu: Guided path. If we are inside theater / bookstore / ship, entering flythrough
			 * would sample the main path while the interior scene is still active — fix by exiting
			 * to the main world on the main path end (same as interior exits), not enterFlythrough() from t=0.
			 */
			function enterGuidedFlythroughFromNav() {
				if ( !mainFlythroughState || !mainMapRoot ) return;
				if ( isInteriorMap() ) {
					teleportMiniNavExitFlythroughIfNeeded();
					mapTeleportCooldownUntil = performance.now() + 1600;
					if ( activeMap === 'theater' ) exitTheaterToMain();
					else if ( activeMap === 'bookstore' ) exitBookstoreToMain();
					else if ( activeMap === 'ship' ) exitShipToMain();
					return;
				}
				if ( !flythroughActive ) enterFlythrough();
			}

			function teleportMiniNavToMainWorld() {
				if ( !mainMapRoot ) return;
				teleportMiniNavExitFlythroughIfNeeded();
				mapTeleportCooldownUntil = performance.now() + 1600;
				if ( activeMap === 'theater' ) exitTheaterToMain();
				else if ( activeMap === 'bookstore' ) exitBookstoreToMain();
				else if ( activeMap === 'ship' ) exitShipToMain();
			}

			function teleportMiniNavToTheater() {
				if ( !mainMapRoot ) return;
				teleportMiniNavExitFlythroughIfNeeded();
				mapTeleportCooldownUntil = performance.now() + 1600;
				if ( activeMap === 'theater' ) return;
				if ( activeMap === 'bookstore' ) exitBookstoreToMain();
				else if ( activeMap === 'ship' ) exitShipToMain();
				enterTheaterMap();
			}

			function teleportMiniNavToBookstore() {
				if ( !mainMapRoot ) return;
				teleportMiniNavExitFlythroughIfNeeded();
				mapTeleportCooldownUntil = performance.now() + 1600;
				if ( activeMap === 'bookstore' ) return;
				if ( activeMap === 'theater' ) exitTheaterToMain();
				else if ( activeMap === 'ship' ) exitShipToMain();
				enterBookstoreMap( false );
			}

			function teleportMiniNavToShip() {
				if ( !mainMapRoot ) return;
				teleportMiniNavExitFlythroughIfNeeded();
				mapTeleportCooldownUntil = performance.now() + 1600;
				if ( activeMap === 'ship' ) return;
				if ( activeMap === 'theater' ) exitTheaterToMain();
				else if ( activeMap === 'bookstore' ) exitBookstoreToMain();
				enterShipMap( false );
			}

			function bindTreasureMapNavigation() {
				const root = document.getElementById( 'treasure-map-nav' );
				const toggle = document.getElementById( 'treasure-map-nav-toggle' );
				const panel = document.getElementById( 'treasure-map-nav-panel' );
				const modeFree = document.getElementById( 'treasure-map-mode-free' );
				const modeGuided = document.getElementById( 'treasure-map-mode-guided' );
				const goIsland = document.getElementById( 'treasure-map-go-island' );
				const goTheater = document.getElementById( 'treasure-map-go-theater' );
				const goBook = document.getElementById( 'treasure-map-go-bookstore' );
				const goShip = document.getElementById( 'treasure-map-go-ship' );
				if ( !root || !toggle || !panel ) return;

				function setTreasureMapPanelOpen( open ) {
					panel.hidden = !open;
					toggle.setAttribute( 'aria-expanded', open ? 'true' : 'false' );
					if ( open ) updateTreasureMapNavUi();
				}

				toggle.addEventListener( 'click', ( e ) => {
					e.stopPropagation();
					setTreasureMapPanelOpen( panel.hidden );
				} );

				if ( modeFree ) {
					modeFree.addEventListener( 'click', () => {
						if ( flythroughActive ) exitFlythrough();
						updateTreasureMapNavUi();
					} );
				}
				if ( modeGuided ) {
					modeGuided.addEventListener( 'click', () => {
						enterGuidedFlythroughFromNav();
						updateTreasureMapNavUi();
					} );
				}

				function wireGo( el, fn ) {
					if ( !el ) return;
					el.addEventListener( 'click', () => {
						fn();
						setTreasureMapPanelOpen( false );
						updateTreasureMapNavUi();
					} );
				}
				wireGo( goIsland, teleportMiniNavToMainWorld );
				wireGo( goTheater, teleportMiniNavToTheater );
				wireGo( goBook, teleportMiniNavToBookstore );
				wireGo( goShip, teleportMiniNavToShip );

				document.addEventListener( 'pointerdown', ( e ) => {
					if ( panel.hidden ) return;
					if ( root.contains( e.target ) ) return;
					setTreasureMapPanelOpen( false );
				}, true );

				document.addEventListener( 'keydown', ( e ) => {
					if ( e.key !== 'Escape' || panel.hidden ) return;
					setTreasureMapPanelOpen( false );
				} );

				updateTreasureMapNavUi();
			}

			bindTreasureMapNavigation();

			function checkTheaterPortals() {
				if ( performance.now() < mapTeleportCooldownUntil ) return;
				if ( flythroughActive && flythroughSegment !== 'main' ) return;
				const rTheaterEnterSq = THEATER_PORTAL_ENTER_RADIUS * THEATER_PORTAL_ENTER_RADIUS;
				const rBookEnterSq = BOOKSTORE_PORTAL_ENTER_RADIUS * BOOKSTORE_PORTAL_ENTER_RADIUS;
				const rShipEnterSq = SHIP_PORTAL_ENTER_RADIUS * SHIP_PORTAL_ENTER_RADIUS;
				const rExitSq = THEATER_PORTAL_EXIT_RADIUS * THEATER_PORTAL_EXIT_RADIUS;

				if ( activeMap === 'main' && mainMapRoot ) {
					const pos = flythroughActive ? camera.position : playerBody.position;
					const dxT = pos.x - THEATER_PORTAL_MAIN.x;
					const dyT = pos.y - THEATER_PORTAL_MAIN.y;
					const dzT = pos.z - THEATER_PORTAL_MAIN.z;
					if ( dxT * dxT + dyT * dyT + dzT * dzT <= rTheaterEnterSq ) {
						if ( flythroughActive ) exitFlythrough();
						enterTheaterMap();
						mapTeleportCooldownUntil = performance.now() + 1600;
						return;
					}
					const dxB = pos.x - BOOKSTORE_PORTAL_MAIN.x;
					const dyB = pos.y - BOOKSTORE_PORTAL_MAIN.y;
					const dzB = pos.z - BOOKSTORE_PORTAL_MAIN.z;
					if ( dxB * dxB + dyB * dyB + dzB * dzB <= rBookEnterSq ) {
						if ( flythroughActive ) exitFlythrough();
						enterBookstoreMap();
						mapTeleportCooldownUntil = performance.now() + 1600;
						return;
					}
					const dxS = pos.x - SHIP_PORTAL_MAIN.x;
					const dyS = pos.y - SHIP_PORTAL_MAIN.y;
					const dzS = pos.z - SHIP_PORTAL_MAIN.z;
					if ( dxS * dxS + dyS * dyS + dzS * dzS <= rShipEnterSq ) {
						if ( flythroughActive ) exitFlythrough();
						enterShipMap();
						mapTeleportCooldownUntil = performance.now() + 1600;
						return;
					}
				} else if ( activeMap === 'theater' && !isTheaterVideoFullscreen() ) {
					const p = playerBody.position;
					const ex = p.x - THEATER_EXIT_POS.x;
					const ey = p.y - THEATER_EXIT_POS.y;
					const ez = p.z - THEATER_EXIT_POS.z;
					if ( ex * ex + ey * ey + ez * ez <= rExitSq ) {
						exitTheaterToMain();
						mapTeleportCooldownUntil = performance.now() + 1600;
					}
				} else if ( activeMap === 'bookstore' ) {
					const p = playerBody.position;
					const bx = p.x - BOOKSTORE_EXIT_POS.x;
					const by = p.y - BOOKSTORE_EXIT_POS.y;
					const bz = p.z - BOOKSTORE_EXIT_POS.z;
					const rBookSq = BOOKSTORE_EXIT_RADIUS * BOOKSTORE_EXIT_RADIUS;
					if ( bx * bx + by * by + bz * bz <= rBookSq ) {
						exitBookstoreToMain();
						mapTeleportCooldownUntil = performance.now() + 1600;
					}
				} else if ( activeMap === 'ship' ) {
					const p = playerBody.position;
					const sx = p.x - SHIP_EXIT_POS.x;
					const sy = p.y - SHIP_EXIT_POS.y;
					const sz = p.z - SHIP_EXIT_POS.z;
					const rShipSq = SHIP_EXIT_RADIUS * SHIP_EXIT_RADIUS;
					if ( sx * sx + sy * sy + sz * sz <= rShipSq ) {
						exitShipToMain();
						mapTeleportCooldownUntil = performance.now() + 1600;
					}
				}
			}

			function updateTheaterGodRaySunPosition() {
				if ( activeMap !== 'theater' || !theaterMapCache?.godRayScreenMesh ) return;
				if ( isTheaterVideoFullscreen() ) {
					theaterGodRaysPass.uniforms.strength.value = 0;
					return;
				}
				theaterGodRaysPass.uniforms.strength.value = 1.35;
				if ( isMobile ) theaterGodRaysPass.uniforms.exposure.value = 0.36;
				else theaterGodRaysPass.uniforms.exposure.value = 0.52;
				theaterMapCache.godRayScreenMesh.getWorldPosition( _theaterGodRayWorld );
				_theaterGodRayWorld.project( camera );
				const u = THREE.MathUtils.clamp( _theaterGodRayWorld.x * 0.5 + 0.5, -0.25, 1.25 );
				const v = THREE.MathUtils.clamp( _theaterGodRayWorld.y * -0.5 + 0.5, -0.25, 1.25 );
				theaterGodRaysPass.uniforms.sunPosition.value.set( u, v );
			}

			function teleportPlayerIfOob() {
				if ( activeMap === 'main' && playerBody.position.y <= -25 ) {
					playerBody.position.set( SPAWN_POSITION.x, SPAWN_POSITION.y, SPAWN_POSITION.z );
					playerBody.velocity.set( 0, 0, 0 );
					camera.rotation.set( 0, 0, 0 );
				}
				if ( activeMap === 'theater' && playerBody.position.y <= -10 ) {
					playerBody.position.set( THEATER_SPAWN.x, THEATER_SPAWN.y, THEATER_SPAWN.z );
					playerBody.velocity.set( 0, 0, 0 );
				}
				if ( activeMap === 'bookstore' && playerBody.position.y <= -2 ) {
					playerBody.position.set( BOOKSTORE_SPAWN.x, BOOKSTORE_SPAWN.y, BOOKSTORE_SPAWN.z );
					playerBody.velocity.set( 0, 0, 0 );
				}
				if ( activeMap === 'ship' && playerBody.position.y <= -2 ) {
					playerBody.position.set( SHIP_SPAWN.x, SHIP_SPAWN.y, SHIP_SPAWN.z );
					playerBody.velocity.set( 0, 0, 0 );
				}
			}

			function animate() {
				const deltaTime = Math.min( 0.05, clock.getDelta() );
				const torchFireDelta = deltaTime * 0.75;
				for ( let i = 0; i < torchFireMeshes.length; i ++ ) {
					torchFireMeshes[ i ].material.update( torchFireDelta );
				}
				if ( flythroughActive ) {
					updateFlythrough( deltaTime );
					checkTheaterPortals();
				} else {
					updateMobileInput();
					updatePhysics( deltaTime );
					teleportPlayerIfOob();
					checkTheaterPortals();
				}
				masterPostPass.uniforms[ 'time' ].value += deltaTime;
				if ( activeMap === 'theater' && theaterMapCache && theaterMapCache.videoTexture ) {
					theaterMapCache.videoTexture.needsUpdate = true;
				}
				if ( activeMap === 'ship' ) {
					updateShipLanternFlicker( clock.getElapsedTime() );
					updateShipLiteraturePanelsHover( clock.getElapsedTime() );
				}
				if ( activeMap === 'bookstore' ) {
					updateBookstoreLiteraturePanelsHover( clock.getElapsedTime() );
				}
				if ( activeMap === 'theater' ) {
					updateTheaterGodRaySunPosition();
					try { worldAmbientAudio.pause(); } catch ( _e ) {}
				}
				flythroughChoiceMenuGroup.visible = !isInteriorMap();
				if ( flythroughChoiceMenuGroup.visible && ( flythroughChoiceEntries.length > 0 || flythroughExtraLabelRows.length > 0 ) ) {
					for ( let i = 0; i < flythroughChoiceEntries.length; i++ ) {
						flythroughChoiceEntries[ i ].row.quaternion.copy( camera.quaternion );
					}
					for ( let j = 0; j < flythroughExtraLabelRows.length; j++ ) {
						flythroughExtraLabelRows[ j ].row.quaternion.copy( camera.quaternion );
					}
				}
				updateFlythroughChoiceHover();
				composer.render( deltaTime );
				if ( activeMap === 'theater' ) updateTheaterScreenHover();
			}



		</script>
</body>
