<!DOCTYPE html>

<body>
	<a href="../index.html" style="position:fixed;top:12px;left:12px;z-index:10002;font-family:Georgia,'Times New Roman',serif;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;color:#2e1c0a;text-decoration:none;background:rgba(250,243,224,0.92);padding:8px 14px;border-radius:4px;border:1px solid rgba(46,28,10,0.15);box-shadow:0 2px 8px rgba(0,0,0,0.08);">← The Magnet home</a>
	<div id="info">
		<br />
		<span class="desktop-controls"></span>

	</div>
	<div id="container"></div>
	<div id="scroll-container"><div id="scroll-spacer"></div></div>
	<div id="mode-toggle">
		<button id="btn-freecam" class="mode-btn active">Free Cam</button>
		<button id="btn-flythrough" class="mode-btn">Flythrough</button>
	</div>


	<script type="importmap">
		{
				"imports": {
					"three": "https://unpkg.com/three@0.160.0/build/three.module.js",
					"three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
					"cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js",
					"three-particle-fire": "https://unpkg.com/three-particle-fire@0.1.0/dist/three-particle-fire.module.js"
				}
			}
		</script>

	<script type="module">

		import * as THREE from 'three';
		import * as CANNON from 'cannon-es';
		import particleFire from 'three-particle-fire';

			import Stats from 'three/addons/libs/stats.module.js';

			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

			import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
			import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
			import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
			import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
			import { LUTPass } from 'three/addons/postprocessing/LUTPass.js';
			import { LUTCubeLoader } from 'three/addons/loaders/LUTCubeLoader.js';
			import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
			import { Water } from 'three/addons/objects/Water2.js';

			particleFire.install( { THREE: THREE } );

			/** Consolidated post-processing shader (vignette, tilt-shift, film grain) */
			const MasterPostShader = {
				uniforms: {
					'tDiffuse': { value: null },
					'time': { value: 0.0 },
					'resolution': { value: new THREE.Vector2( window.innerWidth, window.innerHeight ) },
					'vignetteEnabled': { value: true },
					'vignetteOffset': { value: 1.0 },
					'vignetteDarkness': { value: 1.2 },
					'grainEnabled': { value: true },
					'grainIntensity': { value: 0.03 },
					'tiltShiftEnabled': { value: false },
					'focusY': { value: 0.5 },
					'focusWidth': { value: 0.35 },
					'blurAmount': { value: 2.0 }
				},
				vertexShader: `
					varying vec2 vUv;
					void main() {
						vUv = uv;
						gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
					}
				`,
				fragmentShader: `
					uniform sampler2D tDiffuse;
					uniform float time;
					uniform vec2 resolution;
					uniform bool vignetteEnabled;
					uniform float vignetteOffset;
					uniform float vignetteDarkness;
					uniform bool grainEnabled;
					uniform float grainIntensity;
					uniform bool tiltShiftEnabled;
					uniform float focusY;
					uniform float focusWidth;
					uniform float blurAmount;
					varying vec2 vUv;
					
					float rand( vec2 co ) {
						return fract( sin( dot( co.xy, vec2( 12.9898, 78.233 ) ) ) * 43758.5453 );
					}
					
					void main() {
						vec2 texelSize = 1.0 / resolution;
						vec4 color;
						
						if ( tiltShiftEnabled && blurAmount > 0.0 ) {
							float dist = abs( vUv.y - focusY );
							float blur = smoothstep( 0.0, focusWidth, dist ) * blurAmount;
							vec4 sum = vec4( 0.0 );
							float total = 0.0;
							for ( float i = -2.0; i <= 2.0; i++ ) {
								float weight = 1.0 - abs( i ) / 2.0;
								vec2 offset = vec2( 0.0, i * blur * texelSize.y );
								sum += texture2D( tDiffuse, vUv + offset ) * weight;
								total += weight;
							}
							for ( float i = -2.0; i <= 2.0; i++ ) {
								float weight = 1.0 - abs( i ) / 2.0;
								vec2 offset = vec2( i * blur * texelSize.x * 0.5, 0.0 );
								sum += texture2D( tDiffuse, vUv + offset ) * weight;
								total += weight;
							}
							color = sum / total;
						} else {
							color = texture2D( tDiffuse, vUv );
						}
						
						if ( grainEnabled && grainIntensity > 0.0 ) {
							float grain = rand( vUv + fract( time ) ) * 2.0 - 1.0;
							color.rgb += grain * grainIntensity;
						}
						
						if ( vignetteEnabled ) {
							vec2 uv = ( vUv - vec2( 0.5 ) ) * vec2( vignetteOffset );
							float vignette = 1.0 - dot( uv, uv );
							vignette = clamp( pow( vignette, vignetteDarkness ), 0.0, 1.0 );
							color.rgb *= vignette;
						}
						
						gl_FragColor = color;
					}
				`
			};

			/** Screen-space light shafts toward the theater screen (stable radial sampling; theater only via strength) */
			const TheaterGodRaysShader = {
				uniforms: {
					tDiffuse: { value: null },
					sunPosition: { value: new THREE.Vector2( 0.5, 0.5 ) },
					decay: { value: 0.968 },
					density: { value: 1.0 },
					weight: { value: 0.56 },
					exposure: { value: 0.52 },
					strength: { value: 0.0 }
				},
				vertexShader: `
					varying vec2 vUv;
					void main() {
						vUv = uv;
						gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
					}
				`,
				fragmentShader: `
					uniform sampler2D tDiffuse;
					uniform vec2 sunPosition;
					uniform float decay;
					uniform float density;
					uniform float weight;
					uniform float exposure;
					uniform float strength;
					varying vec2 vUv;
					void main() {
						vec4 origC = texture2D( tDiffuse, vUv );
						if ( strength < 0.001 ) {
							gl_FragColor = origC;
						} else {
							vec3 orig = origC.rgb;
							vec2 delta = ( vUv - sunPosition ) * density * ( 1.0 / 32.0 );
							vec3 scatter = vec3( 0.0 );
							vec2 coord = vUv;
							float illum = 1.0;
							for ( int i = 0; i < 32; i++ ) {
								coord -= delta;
								vec2 c = clamp( coord, vec2( 0.002 ), vec2( 0.998 ) );
								vec3 s = texture2D( tDiffuse, c ).rgb;
								float lum = dot( s, vec3( 0.2126, 0.7152, 0.0722 ) );
								scatter += s * illum * weight * smoothstep( 0.01, 0.92, lum );
								illum *= decay;
							}
							vec3 outRgb = orig + scatter * exposure * strength;
							gl_FragColor = vec4( outRgb, origC.a );
						}
					}
				`
			};

			const clock = new THREE.Clock();
			const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test( navigator.userAgent );

			const scene = new THREE.Scene();
			scene.background = new THREE.Color( 0x88ccee );
			scene.fog = new THREE.Fog( 0x88ccee, 0, isMobileDevice ? 30 : 50 );

			const camera = new THREE.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 0.1, 200 );
			camera.rotation.order = 'YXZ';

			const fillLight1 = new THREE.HemisphereLight( 0x8dc1de, 0x00668d, 1.5 );
			fillLight1.position.set( 2, 1, 1 );
			scene.add( fillLight1 );

			const sun = new THREE.PointLight( 0xff0000, 1000, 0 );
			sun.position.set( 50, 1, 200 );
			sun.castShadow = true;
			scene.add( sun );

			const directionalLight = new THREE.DirectionalLight( 0xffffff, 2.5 );
			directionalLight.position.set( -5, 25, -1 );
			directionalLight.castShadow = true;
			directionalLight.shadow.camera.near = 0.1;
			directionalLight.shadow.camera.far = 100;
			directionalLight.shadow.camera.right = 20;
			directionalLight.shadow.camera.left = -20;
			directionalLight.shadow.camera.top = 20;
			directionalLight.shadow.camera.bottom = -20;
			const shadowRes = isMobileDevice ? 256 : 512;
			directionalLight.shadow.mapSize.width = shadowRes;
			directionalLight.shadow.mapSize.height = shadowRes;
			directionalLight.shadow.radius = 2;
			directionalLight.shadow.bias = -0.0001;
			directionalLight.shadow.autoUpdate = false;
			directionalLight.shadow.needsUpdate = true;
			scene.add( directionalLight );

			const ambientLight = new THREE.AmbientLight( 0x404040, 0.5 );
			scene.add( ambientLight );

			/** Water plane */
			let water = null;
			const textureLoader = new THREE.TextureLoader();
			const waterParams = { color: 0x0088aa, scale: 4, flowX: 1, flowY: 1 };
			const waterTextureBase = 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/water/';
			
			const container = document.getElementById( 'container' );
			const isMobile = isMobileDevice;
			
			/** Water - full shader on all platforms, optimizations only affect other systems */
			Promise.all( [
				new Promise( ( resolve ) => {
					textureLoader.load( waterTextureBase + 'Water_1_M_Normal.jpg', ( tex ) => {
						tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
						resolve( tex );
					}, undefined, () => resolve( null ) );
				} ),
				new Promise( ( resolve ) => {
					textureLoader.load( waterTextureBase + 'Water_2_M_Normal.jpg', ( tex ) => {
						tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
						resolve( tex );
					}, undefined, () => resolve( null ) );
				} )
			] ).then( ( [ normalMap0, normalMap1 ] ) => {
				if ( normalMap0 && normalMap1 ) {
					const waterGeometry = new THREE.PlaneGeometry( 500, 500 );
					water = new Water( waterGeometry, {
						color: waterParams.color,
						scale: waterParams.scale,
						flowDirection: new THREE.Vector2( waterParams.flowX, waterParams.flowY ),
						normalMap0: normalMap0,
						normalMap1: normalMap1
					} );
					water.position.set( 0, -0.1, 0 );
					water.rotation.x = Math.PI * -0.5;
					scene.add( water );
				}
			} );

			const renderer = new THREE.WebGLRenderer( { 
				antialias: !isMobile,
				powerPreference: isMobile ? 'low-power' : 'high-performance',
				precision: isMobile ? 'mediump' : 'highp'
			} );
			renderer.setPixelRatio( isMobile ? 1.0 : Math.min( window.devicePixelRatio, 1.5 ) );
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.setAnimationLoop( animate );
			renderer.shadowMap.enabled = true;
			renderer.shadowMap.type = isMobile ? THREE.BasicShadowMap : THREE.PCFSoftShadowMap;
			renderer.toneMapping = THREE.ACESFilmicToneMapping;
			renderer.toneMappingExposure = 1.0;
			container.appendChild( renderer.domElement );

			const theaterHoverOverlay = document.createElement( 'div' );
			theaterHoverOverlay.setAttribute( 'aria-hidden', 'true' );
			theaterHoverOverlay.style.cssText = 'display:none;position:fixed;pointer-events:none;z-index:10060;box-sizing:border-box;background:transparent;border-radius:4px;';
			document.body.appendChild( theaterHoverOverlay );

			/** Stats and coordinates display - enabled for both mobile and desktop */
			let stats = new Stats();
			stats.domElement.style.position = 'absolute';
			stats.domElement.style.top = '0px';
			container.appendChild( stats.domElement );

			let coordsDisplay = document.createElement( 'div' );
			coordsDisplay.style.cssText = 'position:absolute;top:50px;left:0;background:rgba(0,0,0,0.7);color:#fff;padding:8px 12px;font:12px monospace;z-index:100;border-radius:0 4px 4px 0;';
			coordsDisplay.innerHTML = 'X: 0.00<br>Y: 0.00<br>Z: 0.00';
			container.appendChild( coordsDisplay );

			const defaultPostProcessingSettings = {
				bloomEnabled: true,
				bloomStrength: 0.2,
				bloomRadius: 1,
				bloomThreshold: 1,
				filmEnabled: true,
				filmNoiseIntensity: 0.03,
				vignetteEnabled: true,
				vignetteOffset: 1.0,
				vignetteDarkness: 1.2,
				tiltShiftEnabled: false,
				tiltShiftFocusY: 0.5,
				tiltShiftFocusWidth: 0.35,
				tiltShiftBlurAmount: 2.0,
				lutEnabled: true,
				lutIntensity: 1
			};

			function loadPostProcessingSettings() {
				try {
					const saved = localStorage.getItem( 'postProcessingSettings' );
					if ( saved ) return { ...defaultPostProcessingSettings, ...JSON.parse( saved ) };
				} catch ( e ) { console.warn( 'Failed to load post-processing settings:', e ); }
				return { ...defaultPostProcessingSettings };
			}

			const postProcessingSettings = loadPostProcessingSettings();

			function savePostProcessingSettings() {
				try { localStorage.setItem( 'postProcessingSettings', JSON.stringify( postProcessingSettings ) ); }
				catch ( e ) { console.warn( 'Failed to save post-processing settings:', e ); }
			}

			/** Post-processing pipeline */
			const composer = new EffectComposer( renderer );

			const renderPass = new RenderPass( scene, camera );
			composer.addPass( renderPass );

			const theaterGodRaysPass = new ShaderPass( TheaterGodRaysShader );
			composer.addPass( theaterGodRaysPass );

			const bloomPass = new UnrealBloomPass(
				new THREE.Vector2( window.innerWidth, window.innerHeight ),
				postProcessingSettings.bloomStrength,
				postProcessingSettings.bloomRadius,
				postProcessingSettings.bloomThreshold
			);
			composer.addPass( bloomPass );

			const masterPostPass = new ShaderPass( MasterPostShader );
			masterPostPass.uniforms[ 'resolution' ].value.set( window.innerWidth, window.innerHeight );
			composer.addPass( masterPostPass );

			let lutPass = null;

			function applyPostProcessingSettings() {
				bloomPass.enabled = postProcessingSettings.bloomEnabled;
				bloomPass.strength = postProcessingSettings.bloomStrength;
				bloomPass.radius = postProcessingSettings.bloomRadius;
				bloomPass.threshold = postProcessingSettings.bloomThreshold;
				masterPostPass.uniforms[ 'grainEnabled' ].value = postProcessingSettings.filmEnabled;
				masterPostPass.uniforms[ 'grainIntensity' ].value = postProcessingSettings.filmNoiseIntensity;
				masterPostPass.uniforms[ 'vignetteEnabled' ].value = postProcessingSettings.vignetteEnabled;
				masterPostPass.uniforms[ 'vignetteOffset' ].value = postProcessingSettings.vignetteOffset;
				masterPostPass.uniforms[ 'vignetteDarkness' ].value = postProcessingSettings.vignetteDarkness;
				masterPostPass.uniforms[ 'tiltShiftEnabled' ].value = postProcessingSettings.tiltShiftEnabled;
				masterPostPass.uniforms[ 'focusY' ].value = postProcessingSettings.tiltShiftFocusY;
				masterPostPass.uniforms[ 'focusWidth' ].value = postProcessingSettings.tiltShiftFocusWidth;
				masterPostPass.uniforms[ 'blurAmount' ].value = postProcessingSettings.tiltShiftBlurAmount;
				if ( lutPass ) {
					lutPass.enabled = postProcessingSettings.lutEnabled;
					lutPass.intensity = postProcessingSettings.lutIntensity;
				}
			}

			applyPostProcessingSettings();

			const lutLoader = new LUTCubeLoader();

			lutLoader.load( './freecam/HardBoost.cube', ( result ) => {
				lutPass = new LUTPass( { lut: result.texture3D, intensity: postProcessingSettings.lutIntensity } );
				lutPass.enabled = postProcessingSettings.lutEnabled;
				composer.insertPass( lutPass, composer.passes.length - 1 );
			} );

			const outputPass = new OutputPass();
			composer.addPass( outputPass );

			/** Theatre.js Flythrough System — scroll-driven with smooth interpolation */
			let flythroughState = null;
			let flythroughActive = false;
			let flythroughTime = 0;
			let flythroughTargetTime = 0;
			const _flythroughEuler = new THREE.Euler( 0, 0, 0, 'XYZ' );
			const scrollContainer = document.getElementById( 'scroll-container' );
			const scrollSpacer = document.getElementById( 'scroll-spacer' );
			const btnFreecam = document.getElementById( 'btn-freecam' );
			const btnFlythrough = document.getElementById( 'btn-flythrough' );

			function cubicBez( t, p0, p1, p2, p3 ) {
				const mt = 1 - t;
				return mt * mt * mt * p0 + 3 * mt * mt * t * p1 + 3 * mt * t * t * p2 + t * t * t * p3;
			}

			function solveBezT( x, cx1, cx2 ) {
				let lo = 0, hi = 1;
				for ( let i = 0; i < 32; i++ ) {
					const mid = ( lo + hi ) / 2;
					if ( cubicBez( mid, 0, cx1, cx2, 1 ) < x ) lo = mid; else hi = mid;
				}
				return ( lo + hi ) / 2;
			}

			function evaluateTrack( keyframes, t ) {
				if ( !keyframes || keyframes.length === 0 ) return 0;
				if ( t <= keyframes[ 0 ].position ) return keyframes[ 0 ].value;
				if ( t >= keyframes[ keyframes.length - 1 ].position ) return keyframes[ keyframes.length - 1 ].value;
				let i = 0;
				for ( ; i < keyframes.length - 1; i++ ) {
					if ( t <= keyframes[ i + 1 ].position ) break;
				}
				const kfA = keyframes[ i ], kfB = keyframes[ i + 1 ];
				const dt = kfB.position - kfA.position;
				if ( dt < 0.0001 ) return kfA.value;
				const tNorm = ( t - kfA.position ) / dt;
				const u = solveBezT( tNorm, kfA.handles[ 2 ], kfB.handles[ 0 ] );
				const vNorm = cubicBez( u, 0, kfA.handles[ 3 ], kfB.handles[ 1 ], 1 );
				return kfA.value + vNorm * ( kfB.value - kfA.value );
			}

			function parseTheatreState( stateJson ) {
				const sheet = stateJson.sheetsById?.[ 'Intro' ];
				if ( !sheet?.sequence ) return null;
				const seq = sheet.sequence;
				const camData = seq.tracksByObject?.[ 'Camera' ];
				if ( !camData ) return null;
				const tracks = {};
				for ( const [ propPath, trackId ] of Object.entries( camData.trackIdByPropPath || {} ) ) {
					const td = camData.trackData[ trackId ];
					if ( td?.keyframes ) tracks[ propPath ] = td.keyframes;
				}
				return { duration: seq.length, tracks };
			}

			function updateFlythrough( deltaTime ) {
				if ( !flythroughState || !flythroughActive ) return;
				const maxScroll = scrollContainer.scrollHeight - scrollContainer.clientHeight;
				if ( maxScroll > 0 ) {
					flythroughTargetTime = ( scrollContainer.scrollTop / maxScroll ) * flythroughState.duration;
				}
				const smoothing = 1 - Math.exp( -6 * deltaTime );
				flythroughTime += ( flythroughTargetTime - flythroughTime ) * smoothing;
				const tr = flythroughState.tracks;
				camera.position.set(
					evaluateTrack( tr[ '["position","x"]' ], flythroughTime ),
					evaluateTrack( tr[ '["position","y"]' ], flythroughTime ),
					evaluateTrack( tr[ '["position","z"]' ], flythroughTime )
				);
				_flythroughEuler.set(
					evaluateTrack( tr[ '["rotation","x"]' ], flythroughTime ),
					evaluateTrack( tr[ '["rotation","y"]' ], flythroughTime ),
					evaluateTrack( tr[ '["rotation","z"]' ], flythroughTime ),
					'XYZ'
				);
				camera.quaternion.setFromEuler( _flythroughEuler );
			}

			function enterFlythrough() {
				if ( !flythroughState ) return;
				flythroughActive = true;
				flythroughTime = 0;
				flythroughTargetTime = 0;
				scrollContainer.style.display = 'block';
				scrollContainer.scrollTop = 0;
				if ( document.pointerLockElement ) document.exitPointerLock();
				btnFlythrough.classList.add( 'active' );
				btnFreecam.classList.remove( 'active' );
			}

			function exitFlythrough() {
				flythroughActive = false;
				scrollContainer.style.display = 'none';
				if ( playerBody ) {
					playerBody.position.set( camera.position.x, camera.position.y, camera.position.z );
					playerBody.velocity.set( 0, 0, 0 );
					smoothedCameraPos.copy( camera.position );
				}
				camera.rotation.order = 'YXZ';
				btnFreecam.classList.add( 'active' );
				btnFlythrough.classList.remove( 'active' );
			}

			btnFreecam.addEventListener( 'click', () => { if ( flythroughActive ) exitFlythrough(); } );
			btnFlythrough.addEventListener( 'click', () => { if ( !flythroughActive && flythroughState ) enterFlythrough(); } );

			let _flyTouchY = null;
			scrollContainer.addEventListener( 'touchstart', ( e ) => {
				if ( !flythroughActive || e.touches.length !== 1 ) return;
				_flyTouchY = e.touches[ 0 ].clientY;
			}, { passive: true } );
			scrollContainer.addEventListener( 'touchmove', ( e ) => {
				if ( !flythroughActive || _flyTouchY === null || e.touches.length !== 1 ) return;
				e.preventDefault();
				const currentY = e.touches[ 0 ].clientY;
				const delta = currentY - _flyTouchY;
				scrollContainer.scrollTop += delta;
				_flyTouchY = currentY;
			}, { passive: false } );
			scrollContainer.addEventListener( 'touchend', () => { _flyTouchY = null; }, { passive: true } );
			scrollContainer.addEventListener( 'touchcancel', () => { _flyTouchY = null; }, { passive: true } );

			fetch( './freecam/flythrough-state.json' )
				.then( r => r.json() )
				.then( state => {
					flythroughState = parseTheatreState( state );
					if ( flythroughState ) {
						const scrollPages = Math.max( 5, Math.ceil( flythroughState.duration ) );
						scrollSpacer.style.height = ( scrollPages * 100 ) + 'vh';
						console.log( 'Flythrough loaded: ' + flythroughState.duration.toFixed( 1 ) + 's, ' + scrollPages + ' scroll pages' );
					}
				} )
				.catch( e => console.warn( 'Flythrough state not loaded:', e ) );

			const PHYSICS_TIMESTEP = 1/60;
			const SPAWN_POSITION = { x: 1.74, y: 1.95, z: 93.46 };
			const PLAYER_HEIGHT = 1.8;
			const PLAYER_RADIUS = 0.4;
			const PLAYER_EYE_HEIGHT = 1.6;
			let cameraMode = 'firstPerson';

			/** Default environment settings */
			const defaultEnvSettings = {
				backgroundColor: '#88ccee',
				fogEnabled: false,
				fogColor: '#88ccee',
				fogNear: 0,
				fogFar: 50,
				hemiSkyColor: '#ffffff',
				hemiGroundColor: '#000000',
				hemiIntensity: 0,
				sunColor: '#ffffff',
				sunIntensity: 0.3,
				sunPosX: -5,
				sunPosY: 25,
				sunPosZ: -1,
				ambientColor: '#ffffff',
				ambientIntensity: 0.4,
				toneMapping: 'ACESFilmic',
				exposure: 1.0,
				showCollisionWireframe: false,
				showColliderVisualization: false,
				cameraMode: 'firstPerson',
				thirdPersonDistance: 5,
				thirdPersonHeight: 2,
				thirdPersonAngle: 0.3,

				for ( let i = torchPointLights.length - 1; i >= 0; i -- ) {
					const pl = torchPointLights.pop();
					scene.remove( pl );
				}
				root.updateMatrixWorld( true );
				const studsAbove = 0.1;
				const torchLightColor = 0xff0000;
				const torchLightIntensity =50;
				const torchLightDistance = 0;
				const fireRadius = 0.5;
				const fireHeight = 5;
				const particleCount = isMobileDevice ? 200 : 400;
				const box = new THREE.Box3();
				const pos = new THREE.Vector3();

				root.traverse( ( child ) => {
					if ( !child.name || child.isLight || !child.name.toLowerCase().includes( 'torch' ) ) return;

					const pl = new THREE.PointLight( torchLightColor, torchLightIntensity, torchLightDistance );
					pl.castShadow = false;

					box.setFromObject( child );
					if ( box.isEmpty() === false ) {
						pos.set(
							( box.min.x + box.max.x ) * 0.5,
							box.max.y + studsAbove,
							( box.min.z + box.max.z ) * 0.5
						);
					} else {
						child.getWorldPosition( pos );
						pos.y += studsAbove;
					}
					pl.position.copy( pos );
					scene.add( pl );
					torchPointLights.push( pl );

					const fireGeo = new particleFire.Geometry( fireRadius, fireHeight, particleCount );
					const fireMat = new particleFire.Material( { color: 0xff2200 } );
					fireMat.setPerspective( camera.fov, window.innerHeight );
					const fireMesh = new THREE.Points( fireGeo, fireMat );
					fireMesh.position.copy( pos );
					scene.add( fireMesh );
					torchFireMeshes.push( fireMesh );
				} );
			}

			const loader = new GLTFLoader();
			const loadingInfo = document.getElementById( 'info' );
			const originalInfoText = loadingInfo.innerHTML;
			loadingInfo.innerHTML = 'Loading model...';

			loader.load( './freecam/maptest2-compressed.glb',
				( gltf ) => {
					loadingInfo.innerHTML = originalInfoText;
					scene.add( gltf.scene );
					mainMapRoot = gltf.scene;

					let collisionMesh = null;
					const collisionNameSet = new Set( [ 'collisionmesh', 'collision', 'collision1' ] );

				gltf.scene.traverse( ( child ) => {
					if ( child.isMesh ) {
						child.castShadow = !isMobile; // Disable shadow casting on mobile
						child.receiveShadow = !isMobile; // Disable shadow receiving on mobile
						if ( child.material?.map ) child.material.map.anisotropy = isMobile ? 1 : 4;
						child.frustumCulled = true;
					}
					/** Hide flame objects */
					if ( child.name && child.name.toLowerCase().includes( 'flame' ) ) {
						child.visible = false;
					}
					if ( !collisionMesh && child.name ) {
						const nameLower = child.name.toLowerCase();
						if ( collisionNameSet.has( nameLower ) || nameLower.includes( 'collision' ) ) collisionMesh = child;
					}
				} );

					if ( collisionMesh ) {
						let totalTriangles = 0, hasValidGeometry = false;
						collisionMesh.traverse( ( child ) => {
							if ( child.isMesh && child.geometry ) {
								hasValidGeometry = true;
								const vertexCount = child.geometry.attributes?.position?.count || 0;
								totalTriangles += vertexCount >= 3 ? Math.floor( vertexCount / 3 ) : 0;
							}
						} );
						
						if ( !hasValidGeometry || totalTriangles === 0 ) {
							addCollisionMeshToWorld( gltf.scene );
						} else {
							addCollisionMeshToWorld( collisionMesh );
							collisionMesh.visible = false;
							
							if ( !isMobile && envSettings.showCollisionWireframe ) {
								requestAnimationFrame( () => {
									collisionWireframe = new THREE.Group();
									collisionWireframe.name = 'CollisionWireframe';
									collisionMesh.traverse( ( child ) => {
										if ( child.isMesh && child.geometry ) {
											const wireMat = new THREE.MeshBasicMaterial( { color: 0x00ff00, wireframe: true, transparent: true, opacity: 0.5, depthTest: true, depthWrite: false } );
											const wireMesh = new THREE.Mesh( child.geometry.clone(), wireMat );
											wireMesh.position.copy( child.position );
											wireMesh.rotation.copy( child.rotation );
											wireMesh.scale.copy( child.scale );
											collisionWireframe.add( wireMesh );
										}
									} );
									scene.add( collisionWireframe );
									collisionWireframe.visible = envSettings.showCollisionWireframe;
								} );
							}
						}
					} else {
						addCollisionMeshToWorld( gltf.scene );
					}

					addTorchPointLights( gltf.scene );

					const spawnPoint = gltf.scene.getObjectByName( 'SpawnPoint' );
					

					applySettings();

					requestAnimationFrame( () => {
						createColliderVisualization();
						if ( colliderVisualization ) colliderVisualization.visible = envSettings.showColliderVisualization;
					} );

					cameraMode = envSettings.cameraMode;
					createGUI(); // Create GUI for both mobile and desktop
				},
				( progress ) => {
					if ( progress.lengthComputable ) loadingInfo.innerHTML = `Loading model... ${ Math.round( progress.loaded / progress.total * 100 ) }%`;
				},
				( error ) => {
					console.error( 'Error loading model:', error );
					loadingInfo.innerHTML = 'Error loading model. Check console.';
				}
			);

			function buildTheaterMap() {
				const group = new THREE.Group();
				group.name = 'TheaterInterior';
				const wood = new THREE.MeshStandardMaterial( { color: 0x4a3728, roughness: 0.85 } );
				const curtain = new THREE.MeshStandardMaterial( { color: 0x6b1024, roughness: 0.75 } );

					new THREE.PlaneGeometry( 44, 48 ),

				);
				floorMesh.rotation.x = -Math.PI / 2;
				floorMesh.receiveShadow = !isMobile;
				group.add( floorMesh );

				const stageMesh = new THREE.Mesh( new THREE.BoxGeometry( 22, 1.4, 8 ), wood );
				stageMesh.position.set( 0, 0.7, -11 );
				stageMesh.castShadow = !isMobile;
				stageMesh.receiveShadow = !isMobile;
				group.add( stageMesh );

				const curtainMesh = new THREE.Mesh( new THREE.PlaneGeometry( 22, 11 ), curtain );
				curtainMesh.position.set( 0, 4.6, -15.25 );
				group.add( curtainMesh );

				for ( let row = 0; row < 5; row++ ) {
					const z = 2 + row * 3.2;
					for ( let i = -6; i <= 6; i++ ) {
						const seat = new THREE.Mesh( new THREE.BoxGeometry( 0.85, 0.55, 0.75 ), seatMat );
						seat.position.set( i * 1.05, 0.28, z );
						seat.castShadow = !isMobile;
						group.add( seat );
					}
				}

				const aisleLight = new THREE.PointLight( 0xffe8cc, 2.5, 22 );
				aisleLight.position.set( 0, 6, 4 );
				group.add( aisleLight );
				const stageLight = new THREE.SpotLight( 0xfff5e6, 18, 28, Math.PI / 5, 0.35, 1 );
				stageLight.position.set( 0, 12, -4 );
				stageLight.target.position.set( 0, 4.2, -13.95 );
				group.add( stageLight );
				group.add( stageLight.target );

				/** 3D video screen (VideoTexture + black backing; toneMapped off for stable color through main composer) */
				const theaterVideo = document.createElement( 'video' );
				theaterVideo.src = './freecam/theater-screen.mp4';
				theaterVideo.crossOrigin = 'anonymous';
				theaterVideo.loop = true;
				theaterVideo.muted = true;
				theaterVideo.playsInline = true;
				theaterVideo.setAttribute( 'playsinline', '' );
				theaterVideo.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;';
				document.body.appendChild( theaterVideo );
				theaterVideo.addEventListener( 'webkitendfullscreen', () => {
					theaterVideo.controls = false;
					theaterVideo.muted = true;
					if ( theaterMapCache?.videoEl === theaterVideo ) restoreTheaterVideoDomPeek();
				} );

				const screenW = 20;
				const screenH = 12.5;
				const screenGroup = new THREE.Group();
				screenGroup.position.set( 0, 4.2, -13.95 );

				const screenBack = new THREE.Mesh(
					new THREE.PlaneGeometry( screenW * 1.02, screenH * 1.02 ),
					new THREE.MeshBasicMaterial( { color: 0x000000 } )
				);
				screenBack.position.z = -0.06;
				screenGroup.add( screenBack );

				const theaterVideoTexture = new THREE.VideoTexture( theaterVideo );
				theaterVideoTexture.colorSpace = THREE.SRGBColorSpace;
				theaterVideoTexture.minFilter = THREE.LinearFilter;
				theaterVideoTexture.magFilter = THREE.LinearFilter;

				const screenMat = new THREE.MeshBasicMaterial( {
					map: theaterVideoTexture,
					toneMapped: false
				} );
				const screenFront = new THREE.Mesh( new THREE.PlaneGeometry( screenW, screenH ), screenMat );
				screenFront.position.z = 0.03;
				screenGroup.add( screenFront );

				group.add( screenGroup );

				const bodies = [];
				const floorShape = new CANNON.Box( new CANNON.Vec3( 22, 0.08, 24 ) );
				const floorBody = new CANNON.Body( { mass: 0, material: groundMaterial } );
				floorBody.addShape( floorShape, new CANNON.Vec3( 0, -0.08, 0 ) );
				bodies.push( floorBody );

				const stageShape = new CANNON.Box( new CANNON.Vec3( 11, 0.7, 4 ) );
				const stageBody = new CANNON.Body( { mass: 0, material: groundMaterial } );
				stageBody.addShape( stageShape, new CANNON.Vec3( 0, 0.7, -11 ) );
				bodies.push( stageBody );

				const wallH = 5;
				const wallY = wallH / 2;
				const north = new CANNON.Body( { mass: 0, material: groundMaterial } );
				north.addShape( new CANNON.Box( new CANNON.Vec3( 22, wallH / 2, 0.25 ) ), new CANNON.Vec3( 0, wallY, -19.5 ) );
				bodies.push( north );
				const south = new CANNON.Body( { mass: 0, material: groundMaterial } );
				south.addShape( new CANNON.Box( new CANNON.Vec3( 22, wallH / 2, 0.25 ) ), new CANNON.Vec3( 0, wallY, 19.5 ) );
				bodies.push( south );
				const east = new CANNON.Body( { mass: 0, material: groundMaterial } );
				east.addShape( new CANNON.Box( new CANNON.Vec3( 0.25, wallH / 2, 24 ) ), new CANNON.Vec3( 21.5, wallY, 0 ) );
				bodies.push( east );
				const west = new CANNON.Body( { mass: 0, material: groundMaterial } );
				west.addShape( new CANNON.Box( new CANNON.Vec3( 0.25, wallH / 2, 24 ) ), new CANNON.Vec3( -21.5, wallY, 0 ) );
				bodies.push( west );

				return {
					group,
					bodies,
					videoTexture: theaterVideoTexture,
					videoEl: theaterVideo,
					godRayScreenMesh: screenFront,
					screenFront,
					screenHalfW: screenW * 0.5,
					screenHalfH: screenH * 0.5
				};
			}

			function theaterRaycastHitsScreen() {
				if ( activeMap !== 'theater' || !theaterMapCache?.screenFront ) return false;
				syncTheaterScreenRaycastMatrices();
				theaterScreenRaycaster.setFromCamera( theaterScreenNdcCenter, camera );
				return theaterScreenRaycaster.intersectObject( theaterMapCache.screenFront, false ).length > 0;
			}

			function restoreTheaterVideoDomPeek() {
				const v = theaterMapCache?.videoEl;
				if ( !v ) return;
				v.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;';
			}

			function updateTheaterScreenHover() {
				if ( !theaterHoverOverlay ) return;
				if ( isTheaterVideoFullscreen() ) {
					theaterHoverOverlay.style.display = 'none';
					theaterHoverOverlay.style.background = '';
					theaterHoverOverlay.style.backgroundImage = '';
					theaterHoverOverlay.style.backgroundOrigin = '';
					theaterHoverOverlay.style.backgroundClip = '';
					theaterHoverOverlay.style.removeProperty( '-webkit-background-clip' );
					theaterHoverOverlay.style.boxShadow = '';
					theaterHoverOverlay.style.border = '';
					return;
				}
				if ( activeMap !== 'theater' || !theaterMapCache?.screenFront ) {
					theaterHoverOverlay.style.display = 'none';
					theaterHoverOverlay.style.background = '';
					theaterHoverOverlay.style.backgroundImage = '';
					theaterHoverOverlay.style.backgroundOrigin = '';
					theaterHoverOverlay.style.backgroundClip = '';
					theaterHoverOverlay.style.removeProperty( '-webkit-background-clip' );
					theaterHoverOverlay.style.boxShadow = '';
					theaterHoverOverlay.style.border = '';
					return;
				}
				syncTheaterScreenRaycastMatrices();
				theaterScreenRaycaster.setFromCamera( theaterScreenNdcCenter, camera );
				const hit = theaterScreenRaycaster.intersectObject( theaterMapCache.screenFront, false ).length > 0;
				if ( !hit ) {
					theaterHoverOverlay.style.display = 'none';
					theaterHoverOverlay.style.background = '';
					theaterHoverOverlay.style.backgroundImage = '';
					theaterHoverOverlay.style.backgroundOrigin = '';
					theaterHoverOverlay.style.backgroundClip = '';
					theaterHoverOverlay.style.removeProperty( '-webkit-background-clip' );
					theaterHoverOverlay.style.boxShadow = '';
					theaterHoverOverlay.style.border = '';
					return;
				}
				const sf = theaterMapCache.screenFront;
				const hw = theaterMapCache.screenHalfW;
				const hh = theaterMapCache.screenHalfH;
				_theaterScrVerts[ 0 ].set( -hw, -hh, 0 ).applyMatrix4( sf.matrixWorld );
				_theaterScrVerts[ 1 ].set( hw, -hh, 0 ).applyMatrix4( sf.matrixWorld );
				_theaterScrVerts[ 2 ].set( hw, hh, 0 ).applyMatrix4( sf.matrixWorld );
				_theaterScrVerts[ 3 ].set( -hw, hh, 0 ).applyMatrix4( sf.matrixWorld );
				const cr = renderer.domElement.getBoundingClientRect();
				let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
				let anyInFront = false;
				for ( let i = 0; i < 4; i++ ) {
					_theaterProj.copy( _theaterScrVerts[ i ] ).project( camera );
					if ( Math.abs( _theaterProj.z ) > 1.01 ) continue;
					anyInFront = true;
					const px = ( _theaterProj.x * 0.5 + 0.5 ) * cr.width + cr.left;
					const py = ( -_theaterProj.y * 0.5 + 0.5 ) * cr.height + cr.top;
					minX = Math.min( minX, px );
					minY = Math.min( minY, py );
					maxX = Math.max( maxX, px );
					maxY = Math.max( maxY, py );
				}
				if ( !anyInFront || minX >= maxX || minY >= maxY ) {
					theaterHoverOverlay.style.display = 'none';
					theaterHoverOverlay.style.background = '';
					theaterHoverOverlay.style.backgroundImage = '';
					theaterHoverOverlay.style.backgroundOrigin = '';
					theaterHoverOverlay.style.backgroundClip = '';
					theaterHoverOverlay.style.removeProperty( '-webkit-background-clip' );
					theaterHoverOverlay.style.boxShadow = '';
					theaterHoverOverlay.style.border = '';
					return;
				}
				const t = masterPostPass.uniforms[ 'time' ].value;
				const bw = 3.5 + 0.2 * Math.sin( t * 1.7 );
				const hue = 198 + 10 * Math.sin( t * 0.85 );
				const sat = 88 + 6 * Math.sin( t * 1.1 );
				const lit = 72 + 5 * Math.sin( t * 0.95 );
				const alpha = 0.78 + 0.14 * Math.sin( t * 1.35 );
				theaterHoverOverlay.style.display = 'block';
				theaterHoverOverlay.style.left = `${ minX }px`;
				theaterHoverOverlay.style.top = `${ minY }px`;
				theaterHoverOverlay.style.width = `${ Math.max( 8, maxX - minX ) }px`;
				theaterHoverOverlay.style.height = `${ Math.max( 8, maxY - minY ) }px`;
				theaterHoverOverlay.style.boxSizing = 'border-box';
				theaterHoverOverlay.style.background = 'transparent';
				theaterHoverOverlay.style.backgroundImage = 'none';
				theaterHoverOverlay.style.backgroundOrigin = '';
				theaterHoverOverlay.style.backgroundClip = '';
				theaterHoverOverlay.style.removeProperty( '-webkit-background-clip' );
				theaterHoverOverlay.style.borderRadius = '5px';
				theaterHoverOverlay.style.outline = 'none';
				theaterHoverOverlay.style.border = `${ bw.toFixed( 2 ) }px solid hsla(${ hue.toFixed( 1 ) }, ${ sat.toFixed( 0 ) }%, ${ lit.toFixed( 1 ) }%, ${ alpha.toFixed( 3 ) })`;
				theaterHoverOverlay.style.boxShadow = `0 0 ${ Math.round( 16 + 5 * Math.sin( t * 1.15 ) ) }px 1px hsla(${ ( hue - 6 ).toFixed( 1 ) }, 85%, 58%, ${ ( 0.2 * alpha ).toFixed( 3 ) }), 0 0 ${ Math.round( 28 + 8 * Math.sin( t * 0.75 ) ) }px 2px hsla(${ ( hue + 8 ).toFixed( 1 ) }, 90%, 68%, ${ ( 0.1 * alpha ).toFixed( 3 ) })`;
			}

			function getTheaterMap() {
				if ( !theaterMapCache ) theaterMapCache = buildTheaterMap();
				return theaterMapCache;
			}

			function enterTheaterMap() {
				if ( activeMap !== 'main' || !mainMapRoot ) return;
				activeMap = 'theater';
				const t = getTheaterMap();
				scene.remove( mainMapRoot );
				setMainMapTorchEffectsVisible( false );
				for ( let i = 0; i < mainWorldStaticBodies.length; i++ ) {
					world.removeBody( mainWorldStaticBodies[ i ] );
				}
				if ( collisionWireframe ) collisionWireframe.visible = false;
				scene.add( t.group );
				for ( let i = 0; i < t.bodies.length; i++ ) {
					world.addBody( t.bodies[ i ] );
				}
				if ( water ) water.visible = false;

				playerBody.position.set( THEATER_SPAWN.x, THEATER_SPAWN.y, THEATER_SPAWN.z );
				playerBody.velocity.set( 0, 0, 0 );
				const eyeH = getPlayerEyeHeight();
				smoothedCameraPos.set( THEATER_SPAWN.x, THEATER_SPAWN.y + eyeH, THEATER_SPAWN.z );
				camera.rotation.order = 'YXZ';
				camera.rotation.x = 0;
				camera.rotation.y = 0;

				scene.background = new THREE.Color( 0x1a1520 );
				scene.fog = new THREE.Fog( 0x1a1520, 6, 38 );
				fillLight1.intensity = Math.max( 0.35, fillLight1.intensity * 0.25 );
				directionalLight.intensity = Math.min( 1.2, directionalLight.intensity * 0.4 );

				theaterSavedBloomEnabled = bloomPass.enabled;
				bloomPass.enabled = false;

				theaterGodRaysPass.uniforms.strength.value = 1.35;
				if ( isMobile ) theaterGodRaysPass.uniforms.exposure.value = 0.36;

				if ( t.videoEl ) {
					t.videoEl.play().catch( () => {} );
				}
			}

			function exitTheaterToMain() {
				if ( activeMap !== 'theater' || !mainMapRoot ) return;
				exitTheaterVideoFullscreenIfActive();
				activeMap = 'main';
				const t = getTheaterMap();
				scene.remove( t.group );
				for ( let i = 0; i < t.bodies.length; i++ ) {
					world.removeBody( t.bodies[ i ] );
				}
				scene.add( mainMapRoot );
				setMainMapTorchEffectsVisible( true );
				for ( let i = 0; i < mainWorldStaticBodies.length; i++ ) {
					world.addBody( mainWorldStaticBodies[ i ] );
				}
				if ( collisionWireframe ) collisionWireframe.visible = envSettings.showCollisionWireframe;
				if ( water ) water.visible = true;

				playerBody.position.set( MAIN_RETURN_POS.x, MAIN_RETURN_POS.y, MAIN_RETURN_POS.z );
				playerBody.velocity.set( 0, 0, 0 );
				const eyeH = getPlayerEyeHeight();
				smoothedCameraPos.set( MAIN_RETURN_POS.x, MAIN_RETURN_POS.y + eyeH, MAIN_RETURN_POS.z );
				camera.rotation.order = 'YXZ';
				camera.rotation.x = 0;
				camera.rotation.y = 0;
				if ( theaterSavedBloomEnabled !== null ) {
					bloomPass.enabled = theaterSavedBloomEnabled;
					theaterSavedBloomEnabled = null;
				}
				theaterGodRaysPass.uniforms.strength.value = 0;
				theaterGodRaysPass.uniforms.exposure.value = 0.52;
				applySettings();

				if ( t.videoEl ) {
					t.videoEl.muted = true;
					t.videoEl.pause();
				}
				restoreTheaterVideoDomPeek();
				if ( theaterHoverOverlay ) theaterHoverOverlay.style.display = 'none';
			}

			function checkTheaterPortals() {
				if ( performance.now() < mapTeleportCooldownUntil ) return;
				const rEnterSq = THEATER_PORTAL_ENTER_RADIUS * THEATER_PORTAL_ENTER_RADIUS;
				const rExitSq = THEATER_PORTAL_EXIT_RADIUS * THEATER_PORTAL_EXIT_RADIUS;

				if ( activeMap === 'main' && mainMapRoot ) {
					const pos = flythroughActive ? camera.position : playerBody.position;
					const dx = pos.x - THEATER_PORTAL_MAIN.x;
					const dy = pos.y - THEATER_PORTAL_MAIN.y;
					const dz = pos.z - THEATER_PORTAL_MAIN.z;
					if ( dx * dx + dy * dy + dz * dz <= rEnterSq ) {
						if ( flythroughActive ) exitFlythrough();
						enterTheaterMap();
						mapTeleportCooldownUntil = performance.now() + 1600;
					}
				} else if ( activeMap === 'theater' && !isTheaterVideoFullscreen() ) {
					const p = playerBody.position;
					const ex = p.x - THEATER_EXIT_POS.x;
					const ey = p.y - THEATER_EXIT_POS.y;
					const ez = p.z - THEATER_EXIT_POS.z;
					if ( ex * ex + ey * ey + ez * ez <= rExitSq ) {
						exitTheaterToMain();
						mapTeleportCooldownUntil = performance.now() + 1600;
					}
				}
			}

			function updateTheaterGodRaySunPosition() {
				if ( activeMap !== 'theater' || !theaterMapCache?.godRayScreenMesh ) return;
				if ( isTheaterVideoFullscreen() ) {
					theaterGodRaysPass.uniforms.strength.value = 0;
					return;
				}
				theaterGodRaysPass.uniforms.strength.value = 1.35;
				if ( isMobile ) theaterGodRaysPass.uniforms.exposure.value = 0.36;
				else theaterGodRaysPass.uniforms.exposure.value = 0.52;
				theaterMapCache.godRayScreenMesh.getWorldPosition( _theaterGodRayWorld );
				_theaterGodRayWorld.project( camera );
				const u = THREE.MathUtils.clamp( _theaterGodRayWorld.x * 0.5 + 0.5, -0.25, 1.25 );
				const v = THREE.MathUtils.clamp( _theaterGodRayWorld.y * -0.5 + 0.5, -0.25, 1.25 );
				theaterGodRaysPass.uniforms.sunPosition.value.set( u, v );
			}

			function teleportPlayerIfOob() {
				if ( activeMap === 'main' && playerBody.position.y <= -25 ) {
					playerBody.position.set( SPAWN_POSITION.x, SPAWN_POSITION.y, SPAWN_POSITION.z );
					playerBody.velocity.set( 0, 0, 0 );
					camera.rotation.set( 0, 0, 0 );
				}
				if ( activeMap === 'theater' && playerBody.position.y <= -10 ) {
					playerBody.position.set( THEATER_SPAWN.x, THEATER_SPAWN.y, THEATER_SPAWN.z );
					playerBody.velocity.set( 0, 0, 0 );
				}
			}

			function animate() {
				const deltaTime = Math.min( 0.05, clock.getDelta() );
				const torchFireDelta = deltaTime * 0.75;
				for ( let i = 0; i < torchFireMeshes.length; i ++ ) {
					torchFireMeshes[ i ].material.update( torchFireDelta );
				}
				if ( flythroughActive ) {
					updateFlythrough( deltaTime );
					checkTheaterPortals();
				} else {
					updateMobileInput();
					updatePhysics( deltaTime );
					teleportPlayerIfOob();
					checkTheaterPortals();
				}
				masterPostPass.uniforms[ 'time' ].value += deltaTime;
				if ( activeMap === 'theater' && theaterMapCache && theaterMapCache.videoTexture ) {
					theaterMapCache.videoTexture.needsUpdate = true;
				}
				if ( activeMap === 'theater' ) updateTheaterGodRaySunPosition();
				composer.render( deltaTime );
				if ( activeMap === 'theater' ) updateTheaterScreenHover();
				stats.update();
				coordsDisplay.innerHTML = `X: ${camera.position.x.toFixed(2)}<br>Y: ${camera.position.y.toFixed(2)}<br>Z: ${camera.position.z.toFixed(2)}`;
			}



		</script>
